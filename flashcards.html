<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>フラッシュカード | 韓国語遊びラボ、「コアラ」</title>
<link href="https://fonts.googleapis.com/css2?family=Single+Day&family=Noto+Sans+JP:wght@400;500;700&family=Gaegu:wght@700&family=Yomogi&family=Poor+Story&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">

  <div class="site-header">
    <a class="logo-link" href="index.html">
      <img src="koara_logo.png" alt="코아라">
      <div class="jp">韓国語遊びラボ、「コアラ」</div>
    </a>
  </div>

  <div class="notice-banner" style="opacity:0.6;">
    <span class="badge" style="background:#c2b5a6;">-</span>
    <span class="text">お知らせは準備中です</span>
  </div>

  <div class="tabbar">
    <a class="tab" href="index.html"><span class="jp">ホーム</span><span class="kr">홈</span></a>
    <a class="tab" href="games.html"><span class="jp">ゲーム</span><span class="kr">게임</span></a>
    <a class="tab" href="manga.html"><span class="jp">マンガ</span><span class="kr">만화</span></a>
    <a class="tab" href="materials.html"><span class="jp">資料室</span><span class="kr">자료실</span></a>
    <a class="tab active" href="flashcards.html"><span class="jp">カード</span><span class="kr">카드</span></a>
    <a class="tab" href="board.html"><span class="jp">掲示板</span><span class="kr">게시판</span></a>
    <a class="tab" href="notices.html"><span class="jp">お知らせ</span><span class="kr">공지</span></a>
  </div>

  <div class="content">
    <div class="section">
      <div class="section-head">
        <span class="jp">フラッシュカード</span>
        <span class="kr">플래시카드</span>
        <span class="count" id="itemCount">-</span>
      </div>

      <div class="admin-panel" id="adminPanel" style="display:none;">
        <h3 id="panelTitle">✎ 新しい単語セットを追加</h3>
        <div class="admin-field"><label>セットのタイトル</label><input type="text" id="fTitle" placeholder="음식 단어 20개"></div>
        <div class="admin-field"><label>説明</label><input type="text" id="fDesc" placeholder="식당·요리 관련 기초 단어"></div>
        <div class="admin-field">
          <label>単語カード（一括入力）</label>
          <textarea id="fCards" style="min-height:140px;" placeholder="김치 | キムチ | 김치는 맵고 맛있어요.
비빔밥 | ビビンバ | 비빔밥을 자주 먹어요."></textarea>
          <div class="hint">한 줄에 카드 1개씩, <b>한국어 | 일본어 | 예문</b> 형식으로 " | "(파이프)로 구분해서 입력하세요. 예문은 생략 가능해요.<br>파이프(|) 입력법 — PC/Mac 일본어 키보드: <b>Shift + ¥</b> 키 / 스마트폰: 기호(記号) 키보드에서 찾기</div>
        </div>
        <button class="admin-submit-btn" id="submitBtn">投稿する</button>
        <button class="cancel-edit-btn" id="cancelEditBtn" style="display:none;">編集をキャンセル</button>
      </div>
      <div class="admin-login-row" id="adminLoginRow" style="display:none;">
        <a id="adminLoginLink">管理者としてログイン</a>
      </div>

      <div class="toon-list" id="itemList">
        <div class="board-empty">読み込み中...</div>
      </div>
    </div>
  </div>

</div>

<button class="admin-toggle" id="adminToggleBtn" style="display:none;" title="管理者メニュー">✎</button>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="admin-config.js"></script>
<script>
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const provider = new firebase.auth.GoogleAuthProvider();

const adminPanel = document.getElementById('adminPanel');
const adminLoginRow = document.getElementById('adminLoginRow');
const adminToggleBtn = document.getElementById('adminToggleBtn');
const itemList = document.getElementById('itemList');
const itemCount = document.getElementById('itemCount');
const panelTitle = document.getElementById('panelTitle');
const submitBtn = document.getElementById('submitBtn');
const cancelEditBtn = document.getElementById('cancelEditBtn');

let isAdmin = false;
let lastDocs = [];
let editingId = null;

document.getElementById('adminLoginLink').addEventListener('click', () => {
  auth.signInWithPopup(provider).catch(err => alert('ログイン失敗: ' + err.message));
});

adminToggleBtn.addEventListener('click', () => {
  const willOpen = adminPanel.style.display !== 'block';
  adminPanel.style.display = willOpen ? 'block' : 'none';
  if (!willOpen) resetForm();
});

cancelEditBtn.addEventListener('click', () => {
  resetForm();
  adminPanel.style.display = 'none';
});

auth.onAuthStateChanged(user => {
  isAdmin = !!(user && user.uid === ADMIN_UID);
  adminToggleBtn.style.display = isAdmin ? 'flex' : 'none';
  adminLoginRow.style.display = (!user) ? 'block' : 'none';
  if (!isAdmin) { adminPanel.style.display = 'none'; resetForm(); }
  renderList();
});

function resetForm() {
  editingId = null;
  document.getElementById('fTitle').value = '';
  document.getElementById('fDesc').value = '';
  document.getElementById('fCards').value = '';
  panelTitle.textContent = '✎ 新しい単語セットを追加';
  submitBtn.textContent = '投稿する';
  cancelEditBtn.style.display = 'none';
}

function startEdit(id) {
  const d = lastDocs.find(x => x.id === id);
  if (!d) return;
  editingId = id;
  document.getElementById('fTitle').value = d.title || '';
  document.getElementById('fDesc').value = d.desc || '';
  const raw = (d.cards || []).map(c => [c.front, c.back, c.example].filter(Boolean).join(' | ')).join('\n');
  document.getElementById('fCards').value = raw;
  panelTitle.textContent = '✎ セットを編集';
  submitBtn.textContent = '更新する';
  cancelEditBtn.style.display = 'inline';
  adminPanel.style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function deleteItem(id) {
  if (!confirm('本当に削除しますか？')) return;
  try {
    await db.collection('flashcardSets').doc(id).delete();
  } catch (err) {
    alert('削除失敗: ' + err.message);
  }
}

submitBtn.addEventListener('click', async () => {
  if (!isAdmin) return;
  const title = document.getElementById('fTitle').value.trim();
  const desc = document.getElementById('fDesc').value.trim();
  const raw = document.getElementById('fCards').value.trim();

  if (!title) { alert('タイトルを入力してください。'); return; }
  if (!raw) { alert('カードを最低1つ入力してください。'); return; }

  const cards = raw.split('\n').map(line => line.trim()).filter(Boolean).map(line => {
    const parts = line.split(/[|｜¦│]/).map(p => p.trim());
    const front = parts[0] || '';
    const back = parts[1] || '';
    const example = parts.slice(2).join(', ').trim();
    return { front, back, example };
  }).filter(c => c.front);

  const data = { title, desc, cards };
  submitBtn.disabled = true;
  try {
    if (editingId) {
      await db.collection('flashcardSets').doc(editingId).update(data);
    } else {
      data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
      await db.collection('flashcardSets').add(data);
    }
    resetForm();
    adminPanel.style.display = 'none';
  } catch (err) {
    alert('保存失敗: ' + err.message);
  } finally {
    submitBtn.disabled = false;
  }
});

db.collection('flashcardSets').orderBy('createdAt', 'desc').limit(100)
  .onSnapshot(snapshot => {
    lastDocs = snapshot.docs.map(doc => Object.assign({ id: doc.id }, doc.data()));
    renderList();
  }, err => {
    itemList.innerHTML = '<div class="board-empty">読み込みに失敗しました。</div>';
    console.error(err);
  });

function renderList() {
  if (!lastDocs.length) {
    itemList.innerHTML = '<div class="coming-soon"><div class="cs-icon">🗂️</div><div class="cs-text"><div class="jp">準備中です</div></div></div>';
    itemCount.textContent = '0';
    return;
  }
  itemCount.textContent = lastDocs.length + '/∞';
  itemList.innerHTML = '';
  lastDocs.forEach(d => {
    const count = (d.cards || []).length;
    const row = document.createElement('div');
    row.className = 'fc-set-card';
    row.style.cursor = 'pointer';
    row.innerHTML = `
      <div class="fc-icon">🗂️</div>
      <div class="fc-info">
        <div class="jp">${escapeHtml(d.title)}</div>
        <div class="kr">${escapeHtml(d.desc || '')}</div>
      </div>
      <div class="fc-count">${count}枚</div>
    `;
    row.addEventListener('click', () => { window.location.href = 'flashcards-detail.html?id=' + d.id; });

    if (isAdmin) {
      const actions = document.createElement('div');
      actions.className = 'item-actions';
      actions.innerHTML = `<button class="icon-btn edit-btn" title="編集">✎</button><button class="icon-btn delete-btn" title="削除">🗑</button>`;
      actions.querySelector('.edit-btn').addEventListener('click', (e) => { e.stopPropagation(); startEdit(d.id); });
      actions.querySelector('.delete-btn').addEventListener('click', (e) => { e.stopPropagation(); deleteItem(d.id); });
      row.appendChild(actions);
    }
    itemList.appendChild(row);
  });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>
</body>
</html>
