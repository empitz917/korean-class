<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Batchim Bubble</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
html,body { height:100%; overflow:hidden; }
body {
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  background:linear-gradient(180deg,#a8e6f5 0%,#c3f0e8 40%,#fde8f0 100%);
  display:flex; flex-direction:column; align-items:center;
  position:fixed; width:100%; height:100%;
}
/* floating background bubbles */
.bg-bubble { position:absolute; border-radius:50%; background:radial-gradient(circle at 32% 30%, rgba(255,255,255,.85), rgba(255,255,255,.15) 60%, rgba(255,255,255,0)); pointer-events:none; animation:rise linear infinite; opacity:.55; z-index:0; }
@keyframes rise { from { transform:translateY(105vh) } to { transform:translateY(-15vh) } }

header {
  width:100%; max-width:520px; padding:12px 16px 4px;
  display:flex; justify-content:space-between; align-items:center; z-index:5;
}
.hearts { font-size:22px; letter-spacing:2px; filter:drop-shadow(0 2px 2px rgba(0,0,0,.12)); }
.heart-lost { opacity:.22; filter:grayscale(1); }
.progress { background:rgba(255,255,255,.75); border-radius:999px; padding:5px 14px; font-weight:700; color:#5a7d8a; font-size:14px; box-shadow:0 2px 6px rgba(0,0,0,.08); }
.score { background:rgba(255,255,255,.75); border-radius:999px; padding:5px 12px; font-weight:700; color:#e58aa8; font-size:14px; box-shadow:0 2px 6px rgba(0,0,0,.08); }

.stage { flex:1; width:100%; max-width:520px; position:relative; z-index:2; }

.play-btn {
  position:absolute; top:14px; left:50%; transform:translateX(-50%);
  width:88px; height:88px; border-radius:50%; border:none; cursor:pointer;
  background:radial-gradient(circle at 32% 28%, #ffe9f2, #ffb7cf 70%, #ff9dbd);
  box-shadow:0 8px 20px rgba(255,140,180,.45), inset 0 -6px 12px rgba(255,120,170,.35), inset 0 5px 10px rgba(255,255,255,.8);
  font-size:38px; z-index:6; transition:transform .15s;
}
.play-btn:active { transform:translateX(-50%) scale(.92); }
.play-btn.pulse { animation:pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 0%,100%{ transform:translateX(-50%) scale(1)} 50%{ transform:translateX(-50%) scale(1.08)} }

.bubble {
  position:absolute; border-radius:50%; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  font-weight:800; color:#4a6b7a;
  animation:wobble ease-in-out infinite alternate;
  transition:transform .12s;
  z-index:4; border:none;
  text-shadow:0 1px 0 rgba(255,255,255,.7);
}
.bubble::after {
  content:""; position:absolute; top:12%; left:16%; width:30%; height:22%;
  background:rgba(255,255,255,.85); border-radius:50%; transform:rotate(-25deg); filter:blur(1px);
}
.bubble:active { transform:scale(.93); }
@keyframes wobble { from { transform:translateY(-7px) } to { transform:translateY(7px) } }

.bubble.pop { animation:pop .45s forwards; pointer-events:none; }
@keyframes pop {
  0% { transform:scale(1); opacity:1 }
  45% { transform:scale(1.3); opacity:1 }
  100% { transform:scale(0); opacity:0 }
}
.bubble.wrong { animation:shake .45s; }
@keyframes shake {
  0%,100%{ transform:translateX(0)} 20%{ transform:translateX(-9px)} 40%{ transform:translateX(9px)} 60%{ transform:translateX(-6px)} 80%{ transform:translateX(6px)}
}

.heart-bubble {
  position:absolute; width:64px; height:64px; border-radius:50%;
  background:radial-gradient(circle at 32% 28%, rgba(255,255,255,.95), rgba(255,190,210,.75) 65%, rgba(255,160,190,.7));
  box-shadow:0 6px 16px rgba(255,130,170,.4), inset 0 4px 8px rgba(255,255,255,.9);
  display:flex; align-items:center; justify-content:center; font-size:30px;
  cursor:pointer; z-index:7; border:none;
  animation:drift 7s linear forwards, wobble 1s ease-in-out infinite alternate;
}
@keyframes drift { from { transform:translateX(-90px) } to { transform:translateX(620px) } }

.chip {
  position:absolute; width:34px; height:34px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:15px; font-weight:800; color:#5a7d8a;
  background:radial-gradient(circle at 32% 28%, #fff, #ffeef5 60%, #ffd9e8);
  box-shadow:0 3px 8px rgba(150,120,160,.25), inset 0 2px 4px rgba(255,255,255,.9);
  z-index:3; pointer-events:none;
  transition:left .8s cubic-bezier(.22,1,.36,1), top .8s cubic-bezier(.22,1,.36,1), transform .8s;
}
.chip.landed { animation:chipPop .35s; }
@keyframes chipPop { 0%{ transform:scale(1.4)} 100%{ transform:scale(1)} }

.chip.shine {
  animation:shineGlow 1.1s ease-in-out infinite, chipDance 1.6s ease-in-out infinite;
  z-index:8;
}
@keyframes shineGlow {
  0%,100% { box-shadow:0 0 6px 2px rgba(255,220,120,.55), 0 0 14px 4px rgba(255,180,220,.4), inset 0 2px 4px rgba(255,255,255,.9); }
  50% { box-shadow:0 0 14px 6px rgba(255,230,140,.95), 0 0 26px 10px rgba(255,180,220,.7), inset 0 2px 4px rgba(255,255,255,.9); }
}
@keyframes chipDance { 0%,100%{ transform:scale(1) rotate(0deg)} 25%{ transform:scale(1.12) rotate(-6deg)} 75%{ transform:scale(1.12) rotate(6deg)} }
.sparkle { position:absolute; z-index:9; pointer-events:none; animation:sparkleFly 1.4s ease-out forwards; font-size:16px; }
@keyframes sparkleFly {
  0% { opacity:0; transform:scale(.3) }
  25% { opacity:1; transform:scale(1.25) }
  100% { opacity:0; transform:scale(.6) translateY(-26px) }
}

.toast {
  position:absolute; top:120px; left:50%; transform:translateX(-50%);
  font-size:44px; z-index:9; pointer-events:none; opacity:0;
}
.toast.show { animation:toastUp 1s forwards; }
@keyframes toastUp { 0%{ opacity:0; transform:translateX(-50%) scale(.5)} 25%{ opacity:1; transform:translateX(-50%) scale(1.2)} 60%{ opacity:1; transform:translateX(-50%) scale(1)} 100%{ opacity:0; transform:translateX(-50%) translateY(-40px)} }

.overlay {
  position:fixed; inset:0; background:rgba(160,215,235,.55); backdrop-filter:blur(6px);
  display:flex; align-items:center; justify-content:center; z-index:20;
}
.card {
  background:rgba(255,255,255,.92); border-radius:28px; padding:34px 30px; text-align:center;
  box-shadow:0 14px 40px rgba(90,140,160,.25); max-width:320px; width:86%;
}
.card .big { font-size:56px; margin-bottom:10px; }
.card h1 { font-size:24px; color:#4a6b7a; margin-bottom:6px; }
.card p { color:#7b98a5; font-size:15px; margin-bottom:20px; line-height:1.5; }
.card button {
  border:none; border-radius:999px; padding:14px 38px; font-size:19px; font-weight:800; cursor:pointer;
  background:linear-gradient(135deg,#7fd8c8,#5bc8e8); color:#fff;
  box-shadow:0 6px 16px rgba(80,190,220,.4);
}
.card button:active { transform:scale(.95); }
.hidden { display:none !important; }

.confetti { position:fixed; top:-12px; font-size:22px; z-index:25; pointer-events:none; animation:fall linear forwards; }
@keyframes fall { to { transform:translateY(110vh) rotate(540deg); opacity:.8 } }
</style>
</head>

    .koara-exit-home {
      position:fixed; top:12px; left:12px; z-index:99999;
      width:42px; height:42px; border-radius:50%;
      background:#fff; box-shadow:0 3px 10px rgba(0,0,0,.2);
      display:flex; align-items:center; justify-content:center;
      font-size:20px; text-decoration:none; color:#4a3a30;
    }
    .koara-exit-home:active { transform:scale(0.92); }
  </style>
  <a href="../../index.html" class="koara-exit-home" title="홈으로">🏠</a>

<header>
  <div class="hearts" id="hearts"></div>
  <div class="score">⭐ <span id="score">0</span></div>
  <div class="progress"><span id="round">1</span>/17</div>

<div class="stage" id="stage">
  <button class="play-btn pulse" id="playBtn">🔊</button>
  <div class="toast" id="toast"></div>
</div>

<div class="overlay" id="startOverlay">
  <div class="card">

    <button id="startBtn">START</button>
  </div>
</div>

<div class="overlay hidden" id="endOverlay">
  <div class="card">
    <div class="big" id="endEmoji">🎉</div>
    <h1 id="endTitle"></h1>
    <p id="endMsg"></p>
    <button id="retryBtn">↻ RETRY</button>
  </div>
</div>

let round = 0, hearts = 5, score = 0, locked = true, heartBubbleTimer = null;
const stage = document.getElementById('stage');
const heartsEl = document.getElementById('hearts');
const playBtn = document.getElementById('playBtn');
const toast = document.getElementById('toast');

/* ---------- audio ---------- */
const players = AUDIO.map(b64 => { const a = new Audio('data:audio/mp3;base64,' + b64); a.preload = 'auto'; return a; });
let unlocked = false;
function unlockAudio(){
  if (unlocked) return; unlocked = true;
  const s = new Audio('data:audio/mp3;base64,//uQxAAAAAAAAAAAAAAAAAAAAAAAWGluZwAAAA8AAAACAAACcQCA');
  s.play().catch(()=>{});
}
document.addEventListener('touchstart', unlockAudio, { once:true });
document.addEventListener('mousedown', unlockAudio, { once:true });

function playCurrent(){
  const a = players[round];
  a.currentTime = 0;
  a.play().catch(()=>{});
}
playBtn.addEventListener('click', () => { playCurrent(); });

/* simple synth sfx (no copyright assets) */
let actx = null;
function sfx(type){
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime;
    const notes = type==='good' ? [[880,0,.09],[1320,.09,.12]]
               : type==='heart' ? [[660,0,.08],[880,.08,.08],[1100,.16,.14]]
               : [[220,0,.18]];
    notes.forEach(([f,off,d])=>{
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type==='bad' ? 'sawtooth' : 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(.14, t+off); g.gain.exponentialRampToValueAtTime(.001, t+off+d);
      o.connect(g); g.connect(actx.destination); o.start(t+off); o.stop(t+off+d+.02);
    });
  } catch(e){}
}

/* ---------- background bubbles ---------- */
for (let i=0;i<10;i++){
  const b = document.createElement('div');
  b.className = 'bg-bubble';
  const s = 14 + Math.random()*42;
  b.style.width = b.style.height = s+'px';
  b.style.left = Math.random()*100 + '%';
  b.style.animationDuration = (9 + Math.random()*12) + 's';
  b.style.animationDelay = (-Math.random()*14) + 's';
  document.body.appendChild(b);
}

/* ---------- ui ---------- */
function renderHearts(){
  heartsEl.innerHTML = '';
  for (let i=0;i<5;i++){
    const s = document.createElement('span');
    s.textContent = '💗';
    if (i >= hearts) s.className = 'heart-lost';
    heartsEl.appendChild(s);
  }
}
function showToast(t){
  toast.textContent = t;
  toast.classList.remove('show'); void toast.offsetWidth;
  toast.classList.add('show');
}

const PALETTES = [
  ['#ffe3ee','#ffc4da'], ['#e0f5ff','#bfe6fb'], ['#e8ffe9','#c6f2cd'],
  ['#fff6dc','#ffe9ae'], ['#f0e8ff','#dcccfa']
];

function shuffle(arr){ const a = arr.slice(); for (let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function layoutSpots(){
  const W = stage.clientWidth, H = stage.clientHeight;
  const top = 140, bottom = H - 60;
  const availH = bottom - top;
  const s = Math.min(110, W * 0.27);
  /* 올림픽 마크 스타일: 위 2개가 아래 3개의 틈 위에 겹치듯 배치 */
  const cy = top + availH * 0.48;
  const rowGap = s * 0.88;
  return [
    { x: W*0.36, y: cy - rowGap/2 },
    { x: W*0.64, y: cy - rowGap/2 },
    { x: W*0.22, y: cy + rowGap/2 },
    { x: W*0.50, y: cy + rowGap/2 },
    { x: W*0.78, y: cy + rowGap/2 },
  ];
}

/* 수집 칩 슬롯: 받침 종류별 고정 위치
   왼쪽: 감간강갈 / 위: 밥갚 / 하단: 곧갖곳같잦꽃씻옇 / 오른쪽: 박부엌밖 */
function chipSlotFor(roundIdx){
  const W = stage.clientWidth, H = stage.clientHeight;
  const leftY  = [0.30,0.46,0.62,0.78].map(p => 130+(H-190)*p-17);
  const rightY = [0.34,0.52,0.70].map(p => 130+(H-190)*p-17);
  const botX   = [0.09,0.207,0.324,0.441,0.559,0.676,0.793,0.91].map(p => W*p-17);
  if (roundIdx <= 3)  return { x: 6,       y: leftY[roundIdx] };        /* 감간강갈 */
  if (roundIdx <= 5)  return { x: W*(roundIdx===4?0.30:0.70)-17, y: 30 }; /* 밥갚 */
  if (roundIdx <= 13) return { x: botX[roundIdx-6], y: H-44 };          /* ㄷ소리 8개 */
  return { x: W-40, y: rightY[roundIdx-14] };                            /* 박부엌밖 */
}
function collectChip(letter, fromX, fromY, roundIdx){
  const slot = chipSlotFor(roundIdx);
  const c = document.createElement('div');
  c.className = 'chip';
  c.textContent = letter;
  if (letter.length > 1) c.style.fontSize = '11px';
  c.style.left = fromX + 'px';
  c.style.top = fromY + 'px';
  stage.appendChild(c);
  requestAnimationFrame(() => requestAnimationFrame(() => {
    c.style.left = slot.x + 'px';
    c.style.top = slot.y + 'px';
  }));
  setTimeout(() => c.classList.add('landed'), 820);
}

function startRound(){
  locked = false;
  document.getElementById('round').textContent = round + 1;
  stage.querySelectorAll('.bubble, .heart-bubble').forEach(el => el.remove());

  const data = ROUNDS[round];
  const opts = shuffle(data.opts);
  const spots = shuffle(layoutSpots());
  const isWord2 = data.opts[0].length > 1;
  const W = stage.clientWidth;
  const size = Math.min(isWord2 ? 120 : 110, W * 0.27);

  opts.forEach((txt, i) => {
    const b = document.createElement('button');
    b.className = 'bubble';
    b.textContent = txt;
    const pal = PALETTES[i % PALETTES.length];
    b.style.width = b.style.height = size + 'px';
    b.style.fontSize = (isWord2 ? 30 : 40) + 'px';
    b.style.background = `radial-gradient(circle at 32% 28%, rgba(255,255,255,.95), ${pal[0]} 55%, ${pal[1]})`;
    b.style.boxShadow = `0 8px 18px rgba(120,160,190,.28), inset 0 -5px 10px rgba(160,190,220,.25), inset 0 4px 8px rgba(255,255,255,.9)`;
    b.style.left = (spots[i].x - size/2) + 'px';
    b.style.top = (spots[i].y - size/2) + 'px';
    b.style.animationDuration = (2 + Math.random()*1.6) + 's';
    b.style.animationDelay = (-Math.random()*2) + 's';
    b.addEventListener('click', () => tap(b, txt));
    stage.appendChild(b);
  });

  setTimeout(playCurrent, 450);
  maybeSpawnHeart();
}

function tap(el, txt){
  if (locked) return;
  const correct = ROUNDS[round].ans;
  if (txt === correct){
    locked = true;
    el.classList.add('pop');
    collectChip(txt, el.offsetLeft + el.offsetWidth/2 - 17, el.offsetTop + el.offsetHeight/2 - 17, round);
    sfx('good');
    showToast(['🎉','✨','🌟','💮','👏'][Math.floor(Math.random()*5)]);
    score += 10;
    document.getElementById('score').textContent = score;
    setTimeout(nextRound, 850);
  } else {
    el.classList.add('wrong');
    setTimeout(()=>el.classList.remove('wrong'), 500);
    sfx('bad');
    showToast('💦');
    hearts--;
    renderHearts();
    if (hearts <= 0){ locked = true; setTimeout(()=>endGame(false), 700); }
  }
}

function nextRound(){
  round++;
  if (round >= ROUNDS.length){ celebrate(); return; }
  startRound();
}

/* 완주: 칩 전원 반짝반짝 + 장면 유지 후 결과 표시 */
function celebrate(){
  locked = true;
  clearTimeout(heartBubbleTimer);
  stage.querySelectorAll('.bubble, .heart-bubble').forEach(el => el.remove());
  const chips = stage.querySelectorAll('.chip');
  chips.forEach((c, i) => setTimeout(() => c.classList.add('shine'), i * 90));
  sfx('heart');
  confetti();
  /* 칩 주변에 반짝이 별 흩뿌리기 */
  let bursts = 0;
  const twinkler = setInterval(() => {
    chips.forEach(c => {
      if (Math.random() < 0.4){
        const s = document.createElement('div');
        s.className = 'sparkle';
        s.textContent = ['✨','⭐','💫'][Math.floor(Math.random()*3)];
        s.style.left = (c.offsetLeft + (Math.random()*44 - 12)) + 'px';
        s.style.top  = (c.offsetTop  + (Math.random()*44 - 12)) + 'px';
        stage.appendChild(s);
        setTimeout(() => s.remove(), 1500);
      }
    });
    if (++bursts >= 7) clearInterval(twinkler);
  }, 550);
  setTimeout(() => endGame(true), 4200);
}

/* ---------- random heart bubble ---------- */
function maybeSpawnHeart(){
  clearTimeout(heartBubbleTimer);
  if (hearts >= 5 || hearts <= 0) return;
  if (Math.random() < 0.45){
    heartBubbleTimer = setTimeout(spawnHeart, 1500 + Math.random()*3000);
  }
}
function spawnHeart(){
  if (hearts >= 5 || hearts <= 0 || locked) return;
  const h = document.createElement('button');
  h.className = 'heart-bubble';
  h.textContent = '💗';
  const top = 140 + Math.random() * (stage.clientHeight - 260);
  h.style.top = top + 'px';
  h.style.left = '0px';
  h.addEventListener('click', () => {
    if (hearts < 5){ hearts++; renderHearts(); }
    sfx('heart');
    h.classList.add('pop');
    showToast('💗');
    setTimeout(()=>h.remove(), 400);
  });
  h.addEventListener('animationend', (e) => { if (e.animationName === 'drift') h.remove(); });
  stage.appendChild(h);
}

/* ---------- end / restart ---------- */
function endGame(win){
  clearTimeout(heartBubbleTimer);
  const ov = document.getElementById('endOverlay');
  document.getElementById('endEmoji').textContent = win ? '🏆' : '🫧';
  document.getElementById('endTitle').textContent = win ? 'PERFECT!' : 'TRY AGAIN!';
  document.getElementById('endMsg').textContent = '⭐ ' + score + '  ·  💗 ' + hearts;
  ov.classList.remove('hidden');
  if (win) confetti();
}
function confetti(){
  const em = ['🎉','⭐','💗','🫧','✨','🌸'];
  for (let i=0;i<40;i++){
    const c = document.createElement('div');
    c.className = 'confetti';
    c.textContent = em[Math.floor(Math.random()*em.length)];
    c.style.left = Math.random()*100 + 'vw';
    c.style.animationDuration = (2.2 + Math.random()*2.5) + 's';
    c.style.animationDelay = (Math.random()*1.2) + 's';
    document.body.appendChild(c);
    setTimeout(()=>c.remove(), 6000);
  }
}
function reset(){
  round = 0; hearts = 5; score = 0;
  stage.querySelectorAll('.chip').forEach(c => c.remove());
  document.getElementById('score').textContent = 0;
  renderHearts();
  document.getElementById('endOverlay').classList.add('hidden');
  startRound();
}

document.getElementById('startBtn').addEventListener('click', () => {
  unlockAudio();
  document.getElementById('startOverlay').classList.add('hidden');
  renderHearts();
  startRound();
});
document.getElementById('retryBtn').addEventListener('click', reset);
window.addEventListener('resize', () => { /* bubbles reposition next round */ });
renderHearts();
</script>
</body>
</html>
