<body>
<div class="page">

  <div class="site-header">

      <div class="jp">韓国語遊びラボ、「コアラ」</div>

  <div class="notice-banner" id="topNoticeBanner" style="opacity:0.6;">
    <span class="badge" style="background:#c2b5a6;">-</span>

  </div>

  <div class="tabbar">
    <a class="tab" href="index.html"><span class="jp">ホーム</span><span class="kr">홈</span></a>
    <a class="tab" href="games.html"><span class="jp">ゲーム</span><span class="kr">게임</span></a>
    <a class="tab" href="manga.html"><span class="jp">1コマ漫画クイズ</span><span class="kr">한 컷 만화 퀴즈</span></a>
    <a class="tab" href="flashcards.html"><span class="jp">フラッシュカード</span><span class="kr">플래시카드</span></a>
    <a class="tab active" href="grammar-adverb.html"><span class="jp">文法・副詞</span><span class="kr">문법・부사</span></a>
    <a class="tab" href="materials.html"><span class="jp">資料室</span><span class="kr">자료실</span></a>
    <a class="tab" href="board.html"><span class="jp">掲示板</span><span class="kr">게시판</span></a>
    <a class="tab" href="notices.html"><span class="jp">お知らせ</span><span class="kr">공지</span></a>

  <div class="content">
    <div class="section">
      <div class="section-head">
        <span class="jp" id="sectionHeadJp">文法コーナー</span>
        <span class="kr" id="sectionHeadKr">문법 돋보기</span>
        <span class="count" id="itemCount">-</span>
      </div>

      <div class="lex-filter">
        <button class="on" id="filterGrammar">文法 문법</button>
        <button id="filterAdverb">副詞 부사</button>
      </div>

      <div class="admin-panel" id="adminPanel" style="display:none;">
        <h3 id="panelTitle">✎ 新しい項目を追加</h3>
        <div class="admin-field">
          <label>種類</label>
          <select id="fType" style="width:100%; padding:8px 10px; border-radius:8px; border:1px solid #eee0d2; font-family:inherit; font-size:12px;">
            <option value="grammar">文法（문법）</option>
            <option value="adverb">副詞（부사）</option>
          </select>
        </div>
        <div class="admin-field"><label>見出し語（韓国語）</label><input type="text" id="fHeadword" placeholder="-더니"></div>
        <div class="admin-field"><label>意味・要約（日本語）</label><input type="text" id="fMeaningJp" placeholder="観察→変化・結果"></div>
        <div class="admin-field"><label>説明（日本語）</label><textarea id="fDesc" placeholder="観察した事実の後に続く変化や結果を表す。"></textarea></div>
        <div class="admin-field"><label>例文（韓国語）</label><input type="text" id="fExample" placeholder="아까는 춥더니 지금은 덥네요."></div>
        <div class="admin-field"><label>参加を促す一言（任意・質問文だけでOK）</label><input type="text" id="fPrompt" placeholder="皆さんはどんな例文を作りましたか？"></div>
        <div class="admin-field" id="fJaTransWrap" style="display:none;">
          <label>日本語訳（副詞コーナーのみ表示・任意）</label>
          <textarea id="fJaTrans" placeholder="위 내용(설명·예문)에 대응하는 일본어 번역"></textarea>
        </div>
        <button class="admin-submit-btn" id="submitBtn">投稿する</button>
        <button class="cancel-edit-btn" id="cancelEditBtn" style="display:none;">編集をキャンセル</button>
      </div>
      <div class="admin-login-row" id="adminLoginRow" style="display:none;">
        <a id="adminLoginLink">管理者としてログイン</a>
      </div>

      <div class="toon-list" id="itemList">
        <div class="board-empty">読み込み中...</div>
      </div>
    </div>
  </div>

</div>

<button class="admin-toggle" id="adminToggleBtn" style="display:none;" title="管理者メニュー">✎</button>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="admin-config.js"></script>
<script>
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const provider = new firebase.auth.GoogleAuthProvider();

const adminPanel = document.getElementById('adminPanel');
const adminLoginRow = document.getElementById('adminLoginRow');
const adminToggleBtn = document.getElementById('adminToggleBtn');
const itemList = document.getElementById('itemList');
const itemCount = document.getElementById('itemCount');
const panelTitle = document.getElementById('panelTitle');
const submitBtn = document.getElementById('submitBtn');
const cancelEditBtn = document.getElementById('cancelEditBtn');
const sectionHeadJp = document.getElementById('sectionHeadJp');
const sectionHeadKr = document.getElementById('sectionHeadKr');
const filterGrammarBtn = document.getElementById('filterGrammar');
const filterAdverbBtn = document.getElementById('filterAdverb');

let isAdmin = false;
let lastDocs = [];
let editingId = null;
let currentFilter = 'grammar'; // 'grammar' | 'adverb'

document.getElementById('adminLoginLink').addEventListener('click', () => {
  auth.signInWithPopup(provider).catch(err => alert('ログイン失敗: ' + err.message));
});

adminToggleBtn.addEventListener('click', () => {
  const willOpen = adminPanel.style.display !== 'block';
  adminPanel.style.display = willOpen ? 'block' : 'none';
  if (!willOpen) resetForm();
});

cancelEditBtn.addEventListener('click', () => {
  resetForm();
  adminPanel.style.display = 'none';
});

filterGrammarBtn.addEventListener('click', () => setFilter('grammar'));
filterAdverbBtn.addEventListener('click', () => setFilter('adverb'));

function setFilter(type) {
  currentFilter = type;
  filterGrammarBtn.classList.toggle('on', type === 'grammar');
  filterAdverbBtn.classList.toggle('on', type === 'adverb');
  sectionHeadJp.textContent = type === 'grammar' ? '文法コーナー' : '副詞コーナー';
  sectionHeadKr.textContent = type === 'grammar' ? '문법 돋보기' : '부사 돋보기';
  renderList();
}

auth.onAuthStateChanged(user => {
  isAdmin = !!(user && user.uid === ADMIN_UID);
  adminToggleBtn.style.display = isAdmin ? 'flex' : 'none';
  adminLoginRow.style.display = (!user) ? 'block' : 'none';
  if (!isAdmin) { adminPanel.style.display = 'none'; resetForm(); }
  renderList();
});

function updateJaTransVisibility() {
  const t = document.getElementById('fType').value;
  document.getElementById('fJaTransWrap').style.display = (t === 'adverb') ? 'block' : 'none';
}
document.getElementById('fType').addEventListener('change', updateJaTransVisibility);

function resetForm() {
  editingId = null;
  document.getElementById('fType').value = currentFilter;
  document.getElementById('fHeadword').value = '';
  document.getElementById('fMeaningJp').value = '';
  document.getElementById('fDesc').value = '';
  document.getElementById('fExample').value = '';
  document.getElementById('fPrompt').value = '';
  document.getElementById('fJaTrans').value = '';
  updateJaTransVisibility();
  panelTitle.textContent = '✎ 新しい項目を追加';
  submitBtn.textContent = '投稿する';
  cancelEditBtn.style.display = 'none';
}

function startEdit(id) {
  const d = lastDocs.find(x => x.id === id);
  if (!d) return;
  editingId = id;
  document.getElementById('fType').value = d.type || 'grammar';
  document.getElementById('fHeadword').value = d.headword || '';
  document.getElementById('fMeaningJp').value = d.meaningJp || '';
  document.getElementById('fDesc').value = d.desc || '';
  document.getElementById('fExample').value = d.example || '';
  document.getElementById('fPrompt').value = d.prompt || '';
  document.getElementById('fJaTrans').value = d.jaTrans || '';
  updateJaTransVisibility();
  panelTitle.textContent = '✎ 項目を編集';
  submitBtn.textContent = '更新する';
  cancelEditBtn.style.display = 'inline';
  adminPanel.style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function deleteItem(id) {
  if (!confirm('本当に削除しますか？')) return;
  try {
    await db.collection('lexiconEntries').doc(id).delete();
  } catch (err) {
    alert('削除失敗: ' + err.message);
  }
}

submitBtn.addEventListener('click', async () => {
  if (!isAdmin) return;
  const type = document.getElementById('fType').value;
  const headword = document.getElementById('fHeadword').value.trim();
  const meaningJp = document.getElementById('fMeaningJp').value.trim();
  const desc = document.getElementById('fDesc').value.trim();
  const example = document.getElementById('fExample').value.trim();
  const prompt = document.getElementById('fPrompt').value.trim();
  const jaTrans = document.getElementById('fJaTrans').value.trim();

  if (!headword) { alert('見出し語を入力してください。'); return; }
  if (!meaningJp) { alert('意味・要約を入力してください。'); return; }

  const data = { type, headword, meaningJp, desc, example, prompt, jaTrans };
  submitBtn.disabled = true;
  try {
    if (editingId) {
      await db.collection('lexiconEntries').doc(editingId).update(data);
    } else {
      data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
      await db.collection('lexiconEntries').add(data);
    }
    resetForm();
    adminPanel.style.display = 'none';
  } catch (err) {
    alert('保存失敗: ' + err.message);
  } finally {
    submitBtn.disabled = false;
  }
});

db.collection('lexiconEntries').orderBy('createdAt', 'desc').limit(200)
  .onSnapshot(snapshot => {
    lastDocs = snapshot.docs.map(doc => Object.assign({ id: doc.id }, doc.data()));
    renderList();
  }, err => {
    itemList.innerHTML = '<div class="board-empty">読み込みに失敗しました。</div>';
    console.error(err);
  });

function renderList() {
  const filtered = lastDocs.filter(d => (d.type || 'grammar') === currentFilter);

  if (!filtered.length) {
    itemList.innerHTML = '<div class="coming-soon"><div class="cs-icon">🔍</div><div class="cs-text"><div class="jp">準備中です</div></div></div>';
    itemCount.textContent = '0';
    return;
  }
  itemCount.textContent = filtered.length + '/∞';
  itemList.innerHTML = '';
  filtered.forEach(d => {
    const isNew = d.createdAt && (Date.now() - d.createdAt.toDate().getTime()) < 7 * 24 * 60 * 60 * 1000;
    const card = document.createElement('div');
    card.className = 'lex-card';
    const tagClass = d.type === 'adverb' ? 'adverb' : 'grammar';
    const tagLabel = d.type === 'adverb' ? '副詞' : '文法';
    const askUrl = 'board.html?tag=' + encodeURIComponent(d.headword || '');
    card.innerHTML = `
      <div class="lex-top">
        <span class="lex-tag ${tagClass}">${tagLabel}</span>
        <div class="lex-body">
          <div class="head-row">
            <span class="kr-word">${escapeHtml(d.headword)}</span>
            <span class="jp-word">${escapeHtml(d.meaningJp || '')}</span>
            ${isNew ? '<span class="new-badge">NEW</span>' : ''}
          </div>
          <div class="lex-collapse-inner">
            ${d.type === 'adverb' ? buildBilingualGrid(d) : `
            ${d.desc ? `<div class="desc">${escapeHtml(d.desc)}</div>` : ''}
            ${d.example ? `<div class="ex">${escapeHtml(d.example)}</div>` : ''}
            `}
          </div>
          <button class="lex-toggle">続きを読む ▾</button>
          ${d.prompt ? `<div class="lex-prompt">
            <span class="lp-icon">💭</span>
            <div>
              <div class="lp-question">${escapeHtml(d.prompt)}</div>
              <div class="lp-guide"><span class="lp-arrow">👉</span>下の「質問・体験を書く」から書いてください！</div>
            </div>
          </div>` : ''}
        </div>
      </div>
      <div class="lex-actions">
        <a class="ask-btn" href="${askUrl}">🙋 質問・体験を書く</a>
        <span class="ask-caption">わからないことを質問したり、迷った体験や作った例文を教えてください。</span>
      </div>
    `;
    if (isAdmin) {
      const actions = document.createElement('div');
      actions.className = 'item-actions';
      actions.style.position = 'absolute';
      actions.style.top = '10px';
      actions.style.right = '10px';
      actions.innerHTML = `<button class="icon-btn edit-btn" title="編集">✎</button><button class="icon-btn delete-btn" title="削除">🗑</button>`;
      actions.querySelector('.edit-btn').addEventListener('click', () => startEdit(d.id));
      actions.querySelector('.delete-btn').addEventListener('click', () => deleteItem(d.id));
      card.appendChild(actions);
    }
    itemList.appendChild(card);

    const collapseInner = card.querySelector('.lex-collapse-inner');
    const toggleBtn = card.querySelector('.lex-toggle');
    if (collapseInner && toggleBtn) {
      if (collapseInner.scrollHeight > collapseInner.clientHeight + 4) {
        toggleBtn.style.display = 'block';
        toggleBtn.addEventListener('click', () => {
          const expanded = collapseInner.classList.toggle('expanded');
          toggleBtn.textContent = expanded ? '閉じる ▴' : '続きを読む ▾';
        });
      }
    }
  });
}

function splitParagraphs(text) {
  return (text || '').split(/\n\s*\n/).map(s => s.trim()).filter(Boolean);
}

function buildBilingualGrid(d) {
  const krText = [d.desc, d.example].filter(Boolean).join('\n\n');
  const krParas = splitParagraphs(krText);
  const jpParas = splitParagraphs(d.jaTrans);
  if (!krParas.length && !jpParas.length) return '';

  const rows = Math.max(krParas.length, jpParas.length);
  let cells = `<div class="lb-caption">한국어</div><div class="lb-caption">日本語</div>`;
  for (let i = 0; i < rows; i++) {
    cells += `<div class="lb-kr-line">${escapeHtml(krParas[i] || '')}</div><div class="lb-jp-line">${escapeHtml(jpParas[i] || '')}</div>`;
  }
  return `<div class="lex-bilingual-grid">${cells}</div>`;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

// 최상단 공지 배너 (최신 공지 1건)
db.collection('notices').orderBy('createdAt', 'desc').limit(1).get().then(snap => {
  const banner = document.getElementById('topNoticeBanner');
  if (!banner || snap.empty) return;
  const top = snap.docs[0].data();
  const esc = (s) => { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; };
  const createdMs = top.createdAt ? top.createdAt.toDate().getTime() : 0;
  const isNew = top.tag === 'NEW' && (Date.now() - createdMs) < 7 * 24 * 60 * 60 * 1000;
  banner.style.opacity = '1';
  banner.innerHTML = `
    <span class="badge" style="background:${isNew ? '#FF7A59' : '#c2b5a6'}; color:#fff;">${isNew ? 'NEW' : '📢'}</span>
    <a class="text" href="notices.html" style="color:inherit; text-decoration:none;">${esc(top.title)}</a>
  `;
}).catch(() => {});
</script>
</body>
