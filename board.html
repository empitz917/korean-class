          <span id="adminLoggedIn" style="display:none;">
            <span id="adminName" style="color:#a89a8c;"></span>
            <span id="adminLogoutBtn" style="cursor:pointer; text-decoration:underline; margin-left:6px;">ログアウト</span>
          </span>
        </span>
      </div>

      <!-- 글쓰기 영역 (로그인 불필요, 누구나 작성 가능) -->
      <div class="board-write" id="writeArea">
        <input type="text" id="nicknameInput" placeholder="ニックネーム（空欄なら匿名）" style="width:100%; box-sizing:border-box; margin-bottom:8px; padding:10px 12px; border-radius:10px; border:1px solid #eee0d2; font-family:inherit; font-size:12px;">
        <textarea id="postBody" placeholder="自由に書き込んでください（韓国語・日本語どちらでもOK）"></textarea>

<!-- Firebase SDK (compat 버전 - 별도 빌드 도구 없이 바로 사용 가능) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="admin-config.js"></script>
<script>
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const provider = new firebase.auth.GoogleAuthProvider();

const nicknameInput = document.getElementById('nicknameInput');
const postBody = document.getElementById('postBody');
const postBtn = document.getElementById('postBtn');
const boardList = document.getElementById('boardList');
const postCount = document.getElementById('postCount');
const adminLoginBtn = document.getElementById('adminLoginBtn');
const adminLoggedIn = document.getElementById('adminLoggedIn');
const adminName = document.getElementById('adminName');
const adminLogoutBtn = document.getElementById('adminLogoutBtn');

let lastPostTime = 0;
let isAdmin = false;
let lastDocs = [];

// 관리자 전용 로그인 (삭제 권한 확인용, 글쓰기와는 무관)
adminLoginBtn.addEventListener('click', () => {
  auth.signInWithPopup(provider).catch(err => alert('ログインに失敗しました: ' + err.message));
});

adminLogoutBtn.addEventListener('click', () => {
  auth.signOut();
});

auth.onAuthStateChanged(user => {
  isAdmin = !!(user && user.uid === ADMIN_UID);
  if (isAdmin) {
    adminLoginBtn.style.display = 'none';
    adminLoggedIn.style.display = 'inline';
    adminName.textContent = user.displayName || '管理者';
  } else {
    adminLoginBtn.style.display = 'inline';
    adminLoggedIn.style.display = 'none';
  }
  renderList();
});

postBtn.addEventListener('click', async () => {
  const text = postBody.value.trim();
  if (!text) return;

  // 간단한 도배 방지: 10초에 1개
  const now = Date.now();
  if (now - lastPostTime < 10000) {
    alert('少し時間をおいてから投稿してください。');
    return;
  }

  const nickname = nicknameInput.value.trim();

  postBtn.disabled = true;
  try {
    await db.collection('posts').add({
      body: text,
      authorName: nickname || '匿名',
      authorPhoto: '',
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    postBody.value = '';
    lastPostTime = now;
  } catch (err) {
    alert('投稿に失敗しました: ' + err.message);
  } finally {
    postBtn.disabled = false;
  }
});

async function deletePost(id) {
  if (!confirm('この投稿を削除しますか？')) return;
  try {
    await db.collection('posts').doc(id).delete();
  } catch (err) {
    alert('削除失敗: ' + err.message);
  }
}

// 실시간 목록 구독 (최신순, 최대 100개)
db.collection('posts').orderBy('createdAt', 'desc').limit(100)
  .onSnapshot(snapshot => {
    lastDocs = snapshot.docs.map(doc => Object.assign({ id: doc.id }, doc.data()));
    renderList();
  }, err => {
    boardList.innerHTML = '<div class="board-empty">読み込みに失敗しました。firebase-config.jsの設定を確認してください。</div>';
    console.error(err);
  });

function renderList() {
  if (!lastDocs.length) {
    boardList.innerHTML = '<div class="board-empty">まだ投稿がありません。最初の投稿をしてみましょう！</div>';
    postCount.textContent = '0';
    return;
  }
  postCount.textContent = lastDocs.length + '/∞';
  boardList.innerHTML = '';
  lastDocs.forEach(p => {
    const date = p.createdAt ? p.createdAt.toDate() : new Date();
    const dateStr = date.getFullYear() + '.' + String(date.getMonth()+1).padStart(2,'0') + '.' + String(date.getDate()).padStart(2,'0');
    const isNew = (Date.now() - date.getTime()) <  7 * 24 * 60 * 60 * 1000;
    const div = document.createElement('div');
    div.className = 'board-post';
    const replies = p.replies || [];
    const repliesHtml = replies.map(r => {
      const rDate = r.createdAt ? new Date(r.createdAt) : new Date();
      const rDateStr = rDate.getFullYear() + '.' + String(rDate.getMonth()+1).padStart(2,'0') + '.' + String(rDate.getDate()).padStart(2,'0');
      return `
        <div class="reply-item">
          <span class="reply-name">${escapeHtml(r.name || '匿名')}</span>
          <span class="reply-date">${rDateStr}</span>
          <div class="reply-body">${escapeHtml(r.body)}</div>
        </div>`;
    }).join('');
    div.innerHTML = `
      <div class="meta">
        ${p.authorPhoto ? `<img src="${p.authorPhoto}" alt="">` : ''}
        <span class="name">${escapeHtml(p.authorName || '匿名')}</span>
        ${isNew ? '<span class="new-badge">NEW</span>' : ''}
        <span class="date">${dateStr}</span>
      </div>
      <div class="body">${escapeHtml(p.body)}</div>
      ${replies.length ? `<div class="reply-list">${repliesHtml}</div>` : ''}
      <div class="reply-toggle" data-id="${p.id}">返信する</div>
      <div class="reply-form" id="replyForm-${p.id}" style="display:none;">
        <input type="text" class="reply-nickname" placeholder="ニックネーム（空欄なら匿名）">
        <textarea class="reply-textarea" placeholder="返信を入力"></textarea>
        <button class="reply-submit-btn" data-id="${p.id}">送信</button>
      </div>
    `;
    if (isAdmin) {
      const actions = document.createElement('div');
      actions.className = 'item-actions';
      actions.style.marginTop = '8px';
      actions.innerHTML = `<button class="icon-btn delete-btn" title="削除">🗑 削除</button>`;
      actions.querySelector('.delete-btn').style.width = 'auto';
      actions.querySelector('.delete-btn').style.padding = '4px 10px';
      actions.querySelector('.delete-btn').style.borderRadius = '14px';
      actions.querySelector('.delete-btn').style.fontSize = '10px';
      actions.querySelector('.delete-btn').addEventListener('click', () => deletePost(p.id));
      div.appendChild(actions);
    }
    boardList.appendChild(div);
  });

  // 返信する 토글
  boardList.querySelectorAll('.reply-toggle').forEach(el => {
    el.addEventListener('click', () => {
      const form = document.getElementById('replyForm-' + el.dataset.id);
      form.style.display = form.style.display === 'none' ? 'block' : 'none';
    });
  });

  // 返信 제출
  boardList.querySelectorAll('.reply-submit-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.id;
      const form = document.getElementById('replyForm-' + id);
      const nickname = form.querySelector('.reply-nickname').value.trim();
      const body = form.querySelector('.reply-textarea').value.trim();
      if (!body) return;
      btn.disabled = true;
      try {
        await db.collection('posts').doc(id).update({
          replies: firebase.firestore.FieldValue.arrayUnion({
            name: nickname || '匿名',
            body: body,
            createdAt: Date.now()
          })
        });
      } catch (err) {
        alert('返信に失敗しました: ' + err.message);
      } finally {
        btn.disabled = false;
      }
    });
  });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// 최상단 공지 배너 (최신 공지 1건)
db.collection('notices').orderBy('createdAt', 'desc').limit(1).get().then(snap => {
  const banner = document.getElementById('topNoticeBanner');
  if (!banner || snap.empty) return;
  const top = snap.docs[0].data();
  const esc = (s) => { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; };
  banner.style.opacity = '1';
  banner.innerHTML = `
    <span class="badge" style="background:${top.tag === 'NEW' ? '#FF7A59' : '#c2b5a6'}; color:#fff;">${top.tag === 'NEW' ? 'NEW' : '📢'}</span>
    <a class="text" href="notices.html" style="color:inherit; text-decoration:none;">${esc(top.title)}</a>
  `;
}).catch(() => {});
</script>
