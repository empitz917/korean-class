<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ハングル 子音・母音 ゲーム集</title>
<meta name="description" content="子音19字・母音ゲーム・練習アプリをブラウザですぐに楽しめるハングル学習ゲーム集">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Serif+KR:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F3EC;
    --ink:#1F2A3C;
    --sub:#6B7280;
    --celadon:#4F8A82;
    --celadon-dark:#3A6660;
    --gold:#C79A3D;
    --line:#DAD3C2;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans JP', sans-serif;
  }
  .wrap{max-width:960px; margin:0 auto; padding:0 20px;}

  .hero{
    background:#2A374B;
    color:var(--paper);
    padding:64px 20px 56px;
    text-align:center;
  }
  .hero .eyebrow{
    font-size:13px; letter-spacing:.08em; color:var(--gold);
    font-weight:700; margin-bottom:14px;
  }
  .hero h1{
    font-family:'Noto Serif KR', serif;
    font-size:clamp(26px, 5vw, 40px);
    font-weight:900;
    margin:0 0 14px;
    line-height:1.4;
  }
  .hero p{
    color:#C9CDD6; font-size:15px; max-width:520px; margin:0 auto 32px;
    line-height:1.8;
  }
  .train-wrap{
    width:100%; max-width:580px; margin:0 auto;
  }
  .loco-body{ fill:#3A6660; }
  .loco-cab{ fill:#4F8A82; }
  .car1{ fill:#FF6FA0; }
  .car2{ fill:#2FD9C8; }
  .car3{ fill:#FFC94A; }
  .car4{ fill:#8E7CFF; }
  .car5{ fill:#FF8A5C; }
  .car6{ fill:#42C6FF; }
  .car7{ fill:#FF5C93; }
  .car-roof{ fill:rgba(0,0,0,0.14); }
  .coupler{ fill:#8A8371; }
  .wheel-hub{ fill:#C9CDD6; }
  .tire{ fill:#1A1D24; }
  .tire-inner{ fill:#3B4150; }
  .bolt{ fill:#8A93A6; }
  .loco-name{
    font-family:'Jua', sans-serif; font-weight:400; font-size:28px;
    fill:#fff; text-anchor:middle; dominant-baseline:central;
  }
  .rail{ stroke:#B9B0A0; stroke-width:5; }
  .tie{ stroke:#CFC7B6; stroke-width:4; }
  .jamo-letter{
    font-family:'Noto Serif KR', serif; font-weight:900; font-size:34px;
    fill:#fff; text-anchor:middle; dominant-baseline:central;
  }
  .puff{
    fill:#F4F1EA; opacity:0;
    animation:puffFloat 2.6s ease-out infinite;
  }
  .puff2{ animation-delay:.7s; }
  .puff3{ animation-delay:1.4s; }
