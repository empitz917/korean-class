<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1コマ漫画クイズ | 韓国語遊びラボ、「コアラ」</title>
<link href="https://fonts.googleapis.com/css2?family=Single+Day&family=Noto+Sans+JP:wght@400;500;700&family=Gaegu:wght@400;700&family=Do+Hyeon&family=Yomogi&family=Poor+Story&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">

  <div class="site-header">
    <a class="logo-link" href="index.html">
      <img src="koara_logo.png" alt="코아라">
      <div class="jp">韓国語遊びラボ、「コアラ」</div>
    </a>
  </div>

  <div class="notice-banner" style="opacity:0.6;">
    <span class="badge" style="background:#c2b5a6;">-</span>
    <span class="text">お知らせは準備中です</span>
  </div>

  <div class="tabbar">
    <a class="tab" href="index.html"><span class="jp">ホーム</span><span class="kr">홈</span></a>
    <a class="tab" href="games.html"><span class="jp">ゲーム</span><span class="kr">게임</span></a>
    <a class="tab active" href="manga.html"><span class="jp">1コマ漫画クイズ</span><span class="kr">한 컷 만화</span></a>
    <a class="tab" href="flashcards.html"><span class="jp">フラッシュカード</span><span class="kr">플래시카드</span></a>
    <a class="tab" href="materials.html"><span class="jp">資料室</span><span class="kr">자료실</span></a>
    <a class="tab" href="board.html"><span class="jp">掲示板</span><span class="kr">게시판</span></a>
    <a class="tab" href="notices.html"><span class="jp">お知らせ</span><span class="kr">공지</span></a>
  </div>

  <div class="content">
    <div class="section">
      <div class="section-head">
        <span class="jp">1コマ漫画クイズ</span>
        <span class="kr">한 컷 만화</span>
        <span class="count" id="itemCount">-</span>
      </div>

      <div class="admin-panel" id="adminPanel" style="display:none;">
        <h3 id="panelTitle">✎ 新しいエピソードを追加</h3>
        <div class="admin-field"><label>回(예: 1)</label><input type="text" id="fEp" placeholder="1"></div>
        <div class="admin-field"><label>タイトル</label><input type="text" id="fTitle" placeholder="人懐っこいね"></div>
        <div class="admin-field"><label>画像URL</label><input type="text" id="fImg" placeholder="https://..."></div>
        <div class="admin-field"><label>せりふ（吹き出し・日本語）</label><input type="text" id="fBubble" placeholder="어? 저 처음 봐요!"></div>
        <div class="admin-field"><label>せりふ（정답 시 한국어로 전환）</label><input type="text" id="fBubbleKr" placeholder="예: 어? 처음 뵙네요!"></div>
        <div class="admin-field"><label>クイズ：質問（비워두면 자동으로 "韓国語で何て言う？"）</label><input type="text" id="fQuizQ" placeholder="韓国語で何て言う？（기본값, 다른 질문 쓰려면 여기에 입력）"></div>
        <div class="admin-field quiz-row"><input type="radio" name="correctOpt" value="0" checked><input type="text" id="fOpt0" placeholder="선택지 A"></div>
        <div class="admin-field quiz-row"><input type="radio" name="correctOpt" value="1"><input type="text" id="fOpt1" placeholder="선택지 B"></div>
        <div class="admin-field quiz-row"><input type="radio" name="correctOpt" value="2"><input type="text" id="fOpt2" placeholder="선택지 C"></div>
        <div class="admin-field quiz-row"><input type="radio" name="correctOpt" value="3"><input type="text" id="fOpt3" placeholder="선택지 D"></div>
        <div class="admin-field"><label>コアラ先生のひとこと (한국어)</label><textarea id="fChatKr" placeholder="예: 붙임성 좋은 사람 보면 부럽다..."></textarea></div>
        <div class="admin-field"><label>コアラ先生のひとこと（日本語）</label><textarea id="fChat" placeholder="例: 人懐っこい人ってうらやましい..."></textarea></div>
        <button class="admin-submit-btn" id="submitBtn">投稿する</button>
        <button class="cancel-edit-btn" id="cancelEditBtn" style="display:none;">編集をキャンセル</button>
      </div>
      <div class="admin-login-row" id="adminLoginRow" style="display:none;">
        <a id="adminLoginLink">管理者としてログイン</a>
      </div>

      <div class="toon-list" id="itemList">
        <div class="board-empty">読み込み中...</div>
      </div>
    </div>
  </div>

</div>

<button class="admin-toggle" id="adminToggleBtn" style="display:none;" title="管理者メニュー">✎</button>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="admin-config.js"></script>
<script>
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const provider = new firebase.auth.GoogleAuthProvider();

const adminPanel = document.getElementById('adminPanel');
const adminLoginRow = document.getElementById('adminLoginRow');
const adminToggleBtn = document.getElementById('adminToggleBtn');
const itemList = document.getElementById('itemList');
const itemCount = document.getElementById('itemCount');
const panelTitle = document.getElementById('panelTitle');
const submitBtn = document.getElementById('submitBtn');
const cancelEditBtn = document.getElementById('cancelEditBtn');

let isAdmin = false;
let lastDocs = [];
let editingId = null;

document.getElementById('adminLoginLink').addEventListener('click', () => {
  auth.signInWithPopup(provider).catch(err => alert('ログイン失敗: ' + err.message));
});

adminToggleBtn.addEventListener('click', () => {
  const willOpen = adminPanel.style.display !== 'block';
  adminPanel.style.display = willOpen ? 'block' : 'none';
  if (!willOpen) resetForm();
});

cancelEditBtn.addEventListener('click', () => {
  resetForm();
  adminPanel.style.display = 'none';
});

auth.onAuthStateChanged(user => {
  isAdmin = !!(user && user.uid === ADMIN_UID);
  adminToggleBtn.style.display = isAdmin ? 'flex' : 'none';
  adminLoginRow.style.display = (!user) ? 'block' : 'none';
  if (!isAdmin) { adminPanel.style.display = 'none'; resetForm(); }
  renderList();
});

function resetForm() {
  editingId = null;
  ['fEp','fTitle','fImg','fBubble','fBubbleKr','fQuizQ','fOpt0','fOpt1','fOpt2','fOpt3','fChatKr','fChat'].forEach(id => document.getElementById(id).value = '');
  document.querySelector('input[name="correctOpt"][value="0"]').checked = true;
  panelTitle.textContent = '✎ 新しいエピソードを追加';
  submitBtn.textContent = '投稿する';
  cancelEditBtn.style.display = 'none';
}

function startEdit(id) {
  const d = lastDocs.find(x => x.id === id);
  if (!d) return;
  editingId = id;
  document.getElementById('fEp').value = d.ep || '';
  document.getElementById('fTitle').value = d.title || '';
  document.getElementById('fImg').value = d.img || '';
  document.getElementById('fBubble').value = d.bubble || '';
  document.getElementById('fBubbleKr').value = d.bubbleKr || '';
  document.getElementById('fQuizQ').value = d.quizQ || '';
  (d.opts || []).forEach((v, i) => { const el = document.getElementById('fOpt'+i); if (el) el.value = v || ''; });
  document.querySelector('input[name="correctOpt"][value="' + (d.correctIdx || 0) + '"]').checked = true;
  document.getElementById('fChatKr').value = d.chatKr || '';
  document.getElementById('fChat').value = d.chat || '';
  panelTitle.textContent = '✎ エピソードを編集';
  submitBtn.textContent = '更新する';
  cancelEditBtn.style.display = 'inline';
  adminPanel.style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function deleteItem(id) {
  if (!confirm('本当に削除しますか？')) return;
  try {
    await db.collection('manga').doc(id).delete();
  } catch (err) {
    alert('削除失敗: ' + err.message);
  }
}

submitBtn.addEventListener('click', async () => {
  if (!isAdmin) return;
  const ep = document.getElementById('fEp').value.trim();
  const title = document.getElementById('fTitle').value.trim();
  const img = document.getElementById('fImg').value.trim();
  const bubble = document.getElementById('fBubble').value.trim();
  const bubbleKr = document.getElementById('fBubbleKr').value.trim();
  const quizQ = document.getElementById('fQuizQ').value.trim();
  const opts = [0,1,2,3].map(i => document.getElementById('fOpt'+i).value.trim());
  const correctIdx = Number(document.querySelector('input[name="correctOpt"]:checked').value);
  const chatKr = document.getElementById('fChatKr').value.trim();
  const chat = document.getElementById('fChat').value.trim();

  if (!title) { alert('タイトルを入力してください。'); return; }

  const data = { ep, title, img, bubble, bubbleKr, quizQ, opts, correctIdx, chatKr, chat };
  submitBtn.disabled = true;
  try {
    if (editingId) {
      await db.collection('manga').doc(editingId).update(data);
    } else {
      data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
      await db.collection('manga').add(data);
    }
    resetForm();
    adminPanel.style.display = 'none';
  } catch (err) {
    alert('保存失敗: ' + err.message);
  } finally {
    submitBtn.disabled = false;
  }
});

db.collection('manga').orderBy('createdAt', 'desc').limit(100)
  .onSnapshot(snapshot => {
    lastDocs = snapshot.docs.map(doc => Object.assign({ id: doc.id }, doc.data()));
    renderList();
  }, err => {
    itemList.innerHTML = '<div class="board-empty">読み込みに失敗しました。</div>';
    console.error(err);
  });

function renderList() {
  if (!lastDocs.length) {
    itemList.innerHTML = '<div class="coming-soon"><div class="cs-icon">📝</div><div class="cs-text"><div class="jp">準備中です</div></div></div>';
    itemCount.textContent = '0';
    return;
  }
  itemCount.textContent = lastDocs.length + '/∞';
  itemList.innerHTML = '';
  lastDocs.forEach(d => {
    const date = d.createdAt ? d.createdAt.toDate() : new Date();
    const dateStr = date.getFullYear() + '.' + String(date.getMonth()+1).padStart(2,'0') + '.' + String(date.getDate()).padStart(2,'0');
    const row = document.createElement('div');
    row.className = 'toon-item';
    row.style.cursor = 'pointer';
    row.innerHTML = `
      <img class="thumb" src="${d.img || 'koara_logo.png'}" alt="" onerror="this.src='koara_logo.png'">
      <div class="toon-item-body">
        <div class="ep-tag">#${escapeHtml(d.ep || '')}</div>
        <div class="jp">${escapeHtml(d.title)}</div>
        <div class="date">${dateStr}</div>
      </div>
    `;
    row.addEventListener('click', () => { window.location.href = 'manga-detail.html?id=' + d.id; });

    if (isAdmin) {
      const actions = document.createElement('div');
      actions.className = 'item-actions';
      actions.innerHTML = `<button class="icon-btn edit-btn" title="編集">✎</button><button class="icon-btn delete-btn" title="削除">🗑</button>`;
      actions.querySelector('.edit-btn').addEventListener('click', (e) => { e.stopPropagation(); startEdit(d.id); });
      actions.querySelector('.delete-btn').addEventListener('click', (e) => { e.stopPropagation(); deleteItem(d.id); });
      row.appendChild(actions);
    }
    itemList.appendChild(row);
  });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>
</body>
</html>
