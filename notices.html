<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>お知らせ | 韓国語遊びラボ、「コアラ」</title>
<link href="https://fonts.googleapis.com/css2?family=Single+Day&family=Noto+Sans+JP:wght@400;500;700&family=Gaegu:wght@400;700&family=Do+Hyeon&family=Yomogi&family=Poor+Story&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">

  <div class="site-header">
    <a class="logo-link" href="index.html">
      <img src="koara_logo.png" alt="코아라">
      <div class="jp">韓国語遊びラボ、「コアラ」</div>
    </a>
  </div>

  <div class="notice-banner" style="opacity:0.6;">
    <span class="badge" style="background:#c2b5a6;">-</span>
    <span class="text">お知らせは準備中です</span>
  </div>

  <div class="tabbar">
    <a class="tab" href="index.html"><span class="jp">ホーム</span><span class="kr">홈</span></a>
    <a class="tab" href="games.html"><span class="jp">ゲーム</span><span class="kr">게임</span></a>
    <a class="tab" href="manga.html"><span class="jp">ひとコマ漫画</span><span class="kr">한 컷 만화</span></a>
    <a class="tab" href="flashcards.html"><span class="jp">カード</span><span class="kr">카드</span></a>
    <a class="tab" href="materials.html"><span class="jp">資料室</span><span class="kr">자료실</span></a>
    <a class="tab" href="board.html"><span class="jp">掲示板</span><span class="kr">게시판</span></a>
    <a class="tab active" href="notices.html"><span class="jp">お知らせ</span><span class="kr">공지</span></a>
  </div>

  <div class="content">
    <div class="section">
      <div class="section-head">
        <span class="jp">お知らせ一覧</span>
        <span class="kr">공지 목록</span>
        <span class="count" id="itemCount">-</span>
      </div>

      <div class="admin-panel" id="adminPanel" style="display:none;">
        <h3 id="panelTitle">✎ 新しいお知らせを追加</h3>
        <div class="admin-field"><label>タイトル</label><input type="text" id="fTitle" placeholder="発音特訓ワークショップ 参加者募集中！"></div>
        <div class="admin-field">
          <label>タグ</label>
          <select id="fTag">
            <option value="NEW">NEW</option>
            <option value="お知らせ">お知らせ</option>
          </select>
        </div>
        <button class="admin-submit-btn" id="submitBtn">投稿する</button>
        <button class="cancel-edit-btn" id="cancelEditBtn" style="display:none;">編集をキャンセル</button>
      </div>
      <div class="admin-login-row" id="adminLoginRow" style="display:none;">
        <a id="adminLoginLink">管理者としてログイン</a>
      </div>

      <div class="notice-list" id="itemList">
        <div class="board-empty">読み込み中...</div>
      </div>
    </div>
  </div>

</div>

<button class="admin-toggle" id="adminToggleBtn" style="display:none;" title="管理者メニュー">✎</button>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="admin-config.js"></script>
<script>
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const provider = new firebase.auth.GoogleAuthProvider();

const adminPanel = document.getElementById('adminPanel');
const adminLoginRow = document.getElementById('adminLoginRow');
const adminToggleBtn = document.getElementById('adminToggleBtn');
const itemList = document.getElementById('itemList');
const itemCount = document.getElementById('itemCount');
const panelTitle = document.getElementById('panelTitle');
const submitBtn = document.getElementById('submitBtn');
const cancelEditBtn = document.getElementById('cancelEditBtn');

let isAdmin = false;
let lastDocs = [];
let editingId = null;

document.getElementById('adminLoginLink').addEventListener('click', () => {
  auth.signInWithPopup(provider).catch(err => alert('ログイン失敗: ' + err.message));
});

adminToggleBtn.addEventListener('click', () => {
  const willOpen = adminPanel.style.display !== 'block';
  adminPanel.style.display = willOpen ? 'block' : 'none';
  if (!willOpen) resetForm();
});

cancelEditBtn.addEventListener('click', () => {
  resetForm();
  adminPanel.style.display = 'none';
});

auth.onAuthStateChanged(user => {
  isAdmin = !!(user && user.uid === ADMIN_UID);
  adminToggleBtn.style.display = isAdmin ? 'flex' : 'none';
  adminLoginRow.style.display = (!user) ? 'block' : 'none';
  if (!isAdmin) { adminPanel.style.display = 'none'; resetForm(); }
  renderList();
});

function resetForm() {
  editingId = null;
  document.getElementById('fTitle').value = '';
  document.getElementById('fTag').value = 'NEW';
  panelTitle.textContent = '✎ 新しいお知らせを追加';
  submitBtn.textContent = '投稿する';
  cancelEditBtn.style.display = 'none';
}

function startEdit(id) {
  const d = lastDocs.find(x => x.id === id);
  if (!d) return;
  editingId = id;
  document.getElementById('fTitle').value = d.title || '';
  document.getElementById('fTag').value = d.tag || 'NEW';
  panelTitle.textContent = '✎ お知らせを編集';
  submitBtn.textContent = '更新する';
  cancelEditBtn.style.display = 'inline';
  adminPanel.style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function deleteItem(id) {
  if (!confirm('本当に削除しますか？')) return;
  try {
    await db.collection('notices').doc(id).delete();
  } catch (err) {
    alert('削除失敗: ' + err.message);
  }
}

submitBtn.addEventListener('click', async () => {
  if (!isAdmin) return;
  const title = document.getElementById('fTitle').value.trim();
  const tag = document.getElementById('fTag').value;

  if (!title) { alert('タイトルを入力してください。'); return; }

  const data = { title, tag };
  submitBtn.disabled = true;
  try {
    if (editingId) {
      await db.collection('notices').doc(editingId).update(data);
    } else {
      data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
      await db.collection('notices').add(data);
    }
    resetForm();
    adminPanel.style.display = 'none';
  } catch (err) {
    alert('保存失敗: ' + err.message);
  } finally {
    submitBtn.disabled = false;
  }
});

db.collection('notices').orderBy('createdAt', 'desc').limit(100)
  .onSnapshot(snapshot => {
    lastDocs = snapshot.docs.map(doc => Object.assign({ id: doc.id }, doc.data()));
    renderList();
  }, err => {
    itemList.innerHTML = '<div class="board-empty">読み込みに失敗しました。</div>';
    console.error(err);
  });

function renderList() {
  if (!lastDocs.length) {
    itemList.innerHTML = '<div class="coming-soon"><div class="cs-icon">📢</div><div class="cs-text"><div class="jp">お知らせはまだありません</div></div></div>';
    itemCount.textContent = '0';
    return;
  }
  itemCount.textContent = lastDocs.length + '/∞';
  itemList.innerHTML = '';
  lastDocs.forEach((d, i) => {
    const date = d.createdAt ? d.createdAt.toDate() : new Date();
    const dateStr = date.getFullYear() + '.' + String(date.getMonth()+1).padStart(2,'0') + '.' + String(date.getDate()).padStart(2,'0');
    const div = document.createElement('div');
    div.className = 'notice-item';
    const tagClass = (i === 0 && d.tag === 'NEW') ? '' : 'muted';
    div.innerHTML = `
      <span class="tag ${tagClass}">${escapeHtml(d.tag || 'お知らせ')}</span>
      <div class="notice-item-body">
        <div class="jp">${escapeHtml(d.title)}</div>
        <div class="date">${dateStr}</div>
      </div>
    `;
    if (isAdmin) {
      const actions = document.createElement('div');
      actions.className = 'item-actions';
      actions.innerHTML = `<button class="icon-btn edit-btn" title="編集">✎</button><button class="icon-btn delete-btn" title="削除">🗑</button>`;
      actions.querySelector('.edit-btn').addEventListener('click', () => startEdit(d.id));
      actions.querySelector('.delete-btn').addEventListener('click', () => deleteItem(d.id));
      div.appendChild(actions);
    }
    itemList.appendChild(div);
  });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>
</body>
</html>
