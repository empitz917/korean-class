let li=0,dir="KJ",doShuf=false,deck=[],pos=0,hist=[],missed=[],round=1,correct=0,best={};

const $=s=>document.querySelector(s);
$("#vcTotal").textContent=L.reduce((a,l)=>a+l.words.length,0)+"語";
function chips(){$("#vcChips").innerHTML=L.map((l,i)=>{const p=best[l.n]||0;return `<button class="vc-chip ${i==li?'on':''}" data-i="${i}">${parseInt(l.n)}課 ${l.t}<span class="vc-bar" style="width:${p}%"></span></button>`}).join("");
 document.querySelectorAll(".vc-chip").forEach(b=>b.onclick=()=>{li=+b.dataset.i;start()})}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function start(){deck=L[li].words.map((w,i)=>i);if(doShuf)shuffle(deck);pos=0;hist=[];missed=[];round=1;correct=0;chips();render()}
function render(){
 const words=L[li].words;
 if(pos>=deck.length){
  if(missed.length){deck=doShuf?shuffle([...missed]):[...missed];missed=[];pos=0;round++;hist=[];render();return}
  const total=words.length;best[L[li].n]=100;try{localStorage.setItem("koara_shokyu1_fc",JSON.stringify(best))}catch(e){}chips();
  try{gtag('event','flashcard_complete',{set:'shokyu1_'+L[li].n,rounds:round})}catch(e){}
  $("#vcMain").innerHTML=`<div class="vc-done"><div class="vc-big">🎉</div><h2>全部覚えました！</h2><p>${parseInt(L[li].n)}課 ${L[li].t} · ${total}語${round>1?` · ${round}周`:""}</p>
  <button id="vcAgain">↺ もう一度</button>${li<L.length-1?`<button id="vcNext">次の課へ ▶</button>`:""}</div>`;
  $("#vcAgain").onclick=start;if($("#vcNext"))$("#vcNext").onclick=()=>{li++;start();window.scrollTo({top:0,behavior:"smooth"})};return}
 const w=words[deck[pos]],front=dir=="KJ"?`<div class="vc-ko">${w.k}</div>`:`<div class="vc-ja">${w.j}</div>`,back=`<div class="vc-ko">${w.k}</div><div class="vc-ja" style="margin-top:10px">${w.j}</div>`;
 const sm=w.k.length>8||w.j.length>12?"vc-small":"";
 const pct=Math.round(pos/deck.length*100);
 $("#vcMain").innerHTML=`<div class="vc-status"><span>${round>1?'<span class="vc-badge">🔁 復習モード</span> ':''}${pos+1} / ${deck.length}</span><span>✅ ${correct}　🔁 ${missed.length}</span></div>
 <div class="vc-prog"><i style="width:${pct}%"></i></div>
 <div class="vc-stage ${sm}"><div class="vc-card" id="vcCard"><div class="vc-face"><span class="vc-cat">${w.c}</span>${front}<span class="vc-hint">👆 タップでめくる</span></div>
 <div class="vc-face vc-backface"><span class="vc-cat">${w.c}</span>${back}</div></div></div>
 <div class="vc-judge"><button class="vc-ngb" id="vcNg">🔁 まだ</button><button class="vc-okb" id="vcOk">✅ 覚えた</button></div>

 $("#vcUndo").onclick=()=>{if(!hist.length)return;const h=hist.pop();pos--;if(h)correct--;else missed.pop();render()};
}
function judge(ok){hist.push(ok);if(ok)correct++;else missed.push(deck[pos]);pos++;render()}
$("#vcKJ").onclick=()=>{dir="KJ";$("#vcKJ").classList.add("on");$("#vcJK").classList.remove("on");render()};
