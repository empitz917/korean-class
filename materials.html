<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>資料室 | 韓国語遊びラボ、「コアラ」</title>
<link href="https://fonts.googleapis.com/css2?family=Single+Day&family=Noto+Sans+JP:wght@400;500;700&family=Gaegu:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">

  <div class="site-header">
    <a class="logo-link" href="index.html">
      <img src="koara_logo.png" alt="코아라">
      <div class="jp">韓国語遊びラボ、「コアラ」</div>
    </a>
  </div>

  <div class="notice-banner" style="opacity:0.6;">
    <span class="badge" style="background:#c2b5a6;">-</span>
    <span class="text">お知らせは準備中です</span>
  </div>

  <div class="tabbar">
    <a class="tab" href="index.html"><span class="jp">ゲーム</span><span class="kr">게임</span></a>
    <a class="tab" href="manga.html"><span class="jp">マンガ</span><span class="kr">만화</span></a>
    <a class="tab active" href="materials.html"><span class="jp">資料室</span><span class="kr">자료실</span></a>
    <a class="tab" href="board.html"><span class="jp">掲示板</span><span class="kr">게시판</span></a>
    <a class="tab" href="notices.html"><span class="jp">お知らせ</span><span class="kr">공지</span></a>
  </div>

  <div class="content">
    <div class="section">
      <div class="section-head">
        <span class="jp">資料室</span>
        <span class="kr">자료실</span>
        <span class="count" id="itemCount">-</span>
      </div>

      <div class="admin-panel" id="adminPanel" style="display:none;">
        <h3>✎ 新しい資料を追加</h3>
        <div class="admin-field"><label>タイトル</label><input type="text" id="fTitle" placeholder="母音プリント"></div>
        <div class="admin-field"><label>説明</label><textarea id="fDesc" placeholder="韓国語の基本母音10個をなぞって書く練習プリントです。"></textarea></div>
        <div class="admin-field"><label>リンク（PDF・Google Driveなど）</label><input type="text" id="fLink" placeholder="https://..."></div>
        <button class="admin-submit-btn" id="submitBtn">投稿する</button>
      </div>
      <div class="admin-login-row" id="adminLoginRow" style="display:none;">
        <a id="adminLoginLink">管理者としてログイン</a>
      </div>

      <div class="toon-list" id="itemList">
        <div class="board-empty">読み込み中...</div>
      </div>
    </div>
  </div>

</div>

<button class="admin-toggle" id="adminToggleBtn" style="display:none;" title="管理者メニュー">✎</button>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="admin-config.js"></script>
<script>
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const provider = new firebase.auth.GoogleAuthProvider();

const adminPanel = document.getElementById('adminPanel');
const adminLoginRow = document.getElementById('adminLoginRow');
const adminToggleBtn = document.getElementById('adminToggleBtn');
const itemList = document.getElementById('itemList');
const itemCount = document.getElementById('itemCount');

let isAdmin = false;

document.getElementById('adminLoginLink').addEventListener('click', () => {
  auth.signInWithPopup(provider).catch(err => alert('ログイン失敗: ' + err.message));
});

adminToggleBtn.addEventListener('click', () => {
  adminPanel.style.display = (adminPanel.style.display === 'block') ? 'none' : 'block';
});

auth.onAuthStateChanged(user => {
  isAdmin = !!(user && user.uid === ADMIN_UID);
  adminToggleBtn.style.display = isAdmin ? 'flex' : 'none';
  adminLoginRow.style.display = (!user) ? 'block' : 'none';
  if (!isAdmin) adminPanel.style.display = 'none';
});

document.getElementById('submitBtn').addEventListener('click', async () => {
  if (!isAdmin) return;
  const title = document.getElementById('fTitle').value.trim();
  const desc = document.getElementById('fDesc').value.trim();
  const link = document.getElementById('fLink').value.trim();

  if (!title) { alert('タイトルを入力してください。'); return; }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  try {
    await db.collection('materials').add({
      title, desc, link,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    ['fTitle','fDesc','fLink'].forEach(id => document.getElementById(id).value = '');
    adminPanel.style.display = 'none';
  } catch (err) {
    alert('投稿失敗: ' + err.message);
  } finally {
    btn.disabled = false;
  }
});

db.collection('materials').orderBy('createdAt', 'desc').limit(100)
  .onSnapshot(snapshot => {
    if (snapshot.empty) {
      itemList.innerHTML = '<div class="coming-soon"><div class="cs-icon">📂</div><div class="cs-text"><div class="jp">準備中です</div></div></div>';
      itemCount.textContent = '0';
      return;
    }
    itemCount.textContent = snapshot.size + '/∞';
    itemList.innerHTML = '';
    snapshot.forEach(doc => {
      const d = doc.data();
      const date = d.createdAt ? d.createdAt.toDate() : new Date();
      const dateStr = date.getFullYear() + '.' + String(date.getMonth()+1).padStart(2,'0') + '.' + String(date.getDate()).padStart(2,'0');
      const a = document.createElement('a');
      a.className = 'toon-item';
      a.href = d.link || '#';
      a.target = '_blank';
      a.innerHTML = `
        <div class="thumb placeholder">📄</div>
        <div class="toon-item-body">
          <div class="jp">${escapeHtml(d.title)}</div>
          <div class="date">${escapeHtml(d.desc || '')}</div>
        </div>
      `;
      itemList.appendChild(a);
    });
  }, err => {
    itemList.innerHTML = '<div class="board-empty">読み込みに失敗しました。</div>';
    console.error(err);
  });

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>
</body>
</html>
