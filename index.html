<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=Single+Day&family=Noto+Sans+JP:wght@400;500;700&family=Gaegu:wght@700&family=Yomogi&family=Poor+Story&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">

  <!-- 히어로 배너 -->
  <div class="hero-banner">
    <img class="k" src="assets/koala-4.png" alt="" style="width:72px; top:-16px; left:-12px; opacity:0.9;">
    <img class="k" src="assets/koala-5.png" alt="" style="width:74px; top:26px; right:6px; opacity:0.85;">
    <img class="k" src="assets/koala-9.png" alt="" style="width:62px; bottom:-10px; left:0px; opacity:0.85;">
    <img class="k" src="assets/koala-6.png" alt="" style="width:72px; bottom:36px; right:56px; opacity:0.8;">
    <img class="k" src="assets/koala-2.png" alt="" style="width:60px; top:46%; left:-8px; opacity:0.55;">
    <img class="k" src="assets/koala-10.png" alt="" style="width:64px; top:50%; right:-10px; opacity:0.5;">
    <img class="k" src="assets/koala-3.png" alt="" style="width:66px; top:6px; left:38%; opacity:0.4;">
    <img class="k peek" src="assets/koala-peek.png" alt="" style="width:96px; bottom:-6px; left:-16px;">

    <div class="main-content">
      <img src="assets/koala-center.png" alt="코아라" style="width:130px;">
      <div class="jp">韓国語遊びラボ、「コアラ」</div>
      <div class="kr">놀면서 하는 한국어 공부</div>
      <div class="cta-row"><a href="games.html">🎮 게임으로 시작하기</a></div>
    </div>
  </div>

  <div class="notice-banner" style="opacity:0.6;">
    <span class="badge" style="background:#c2b5a6;">-</span>
    <span class="text">お知らせは準備中です</span>
  </div>

  <div class="tabbar">
    <a class="tab active" href="index.html"><span class="jp">ホーム</span><span class="kr">홈</span></a>
    <a class="tab" href="games.html"><span class="jp">ゲーム</span><span class="kr">게임</span></a>
    <a class="tab" href="manga.html"><span class="jp">マンガ</span><span class="kr">만화</span></a>
    <a class="tab" href="materials.html"><span class="jp">資料室</span><span class="kr">자료실</span></a>
    <a class="tab" href="flashcards.html"><span class="jp">カード</span><span class="kr">카드</span></a>
    <a class="tab" href="board.html"><span class="jp">掲示板</span><span class="kr">게시판</span></a>
    <a class="tab" href="notices.html"><span class="jp">お知らせ</span><span class="kr">공지</span></a>
  </div>

  <!-- 빠른 메뉴 -->
  <div class="quick-grid">
    <a href="games.html"><div class="qg-icon" style="background:#FFD9C0;">🎮</div><div class="jp">ゲーム</div><div class="kr">게임</div></a>
    <a href="manga.html"><div class="qg-icon" style="background:#F6D9E8;">📖</div><div class="jp">マンガ</div><div class="kr">만화</div></a>
    <a href="materials.html"><div class="qg-icon" style="background:#D9F0E2;">📂</div><div class="jp">資料室</div><div class="kr">자료실</div></a>
    <a href="flashcards.html"><div class="qg-icon" style="background:#D9E2F6;">🗂️</div><div class="jp">カード</div><div class="kr">카드</div></a>
    <a href="board.html"><div class="qg-icon" style="background:#F6E9D9;">💬</div><div class="jp">掲示板</div><div class="kr">게시판</div></a>
    <a href="notices.html"><div class="qg-icon" style="background:#E4D9F6;">📢</div><div class="jp">お知らせ</div><div class="kr">공지</div></a>
  </div>

  <!-- 최신 공지 위젯 -->
  <div class="home-widget">
    <div class="widget-head">
      <span class="jp">最新のお知らせ</span>
      <span class="kr">최신 공지</span>
      <a class="more" href="notices.html">더보기 ›</a>
    </div>
    <div class="widget-body" id="widgetNotices">
      <div class="home-empty-mini">読み込み中...</div>
    </div>
  </div>

  <!-- 최신 마화 위젯 -->
  <div class="home-widget">
    <div class="widget-head">
      <span class="jp">新着マンガ</span>
      <span class="kr">최신 만화</span>
      <a class="more" href="manga.html">더보기 ›</a>
    </div>
    <div class="widget-body" id="widgetManga">
      <div class="home-empty-mini">読み込み中...</div>
    </div>
  </div>

  <!-- 최신 플래시카드 위젯 -->
  <div class="home-widget">
    <div class="widget-head">
      <span class="jp">フラッシュカード</span>
      <span class="kr">학습 카드</span>
      <a class="more" href="flashcards.html">더보기 ›</a>
    </div>
    <div class="widget-body" id="widgetCards">
      <div class="home-empty-mini">読み込み中...</div>
    </div>
  </div>

  <!-- 최신 자료실 위젯 -->
  <div class="home-widget" style="padding-bottom:20px;">
    <div class="widget-head">
      <span class="jp">資料室</span>
      <span class="kr">자료실</span>
      <a class="more" href="materials.html">더보기 ›</a>
    </div>
    <div class="widget-body" id="widgetMaterials">
      <div class="home-empty-mini">読み込み中...</div>
    </div>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}
function fmtDate(ts) {
  const d = ts ? ts.toDate() : new Date();
  return d.getFullYear() + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + String(d.getDate()).padStart(2,'0');
}

// 최신 공지 3건
db.collection('notices').orderBy('createdAt', 'desc').limit(3).get().then(snap => {
  const el = document.getElementById('widgetNotices');
  if (snap.empty) { el.innerHTML = '<div class="home-empty-mini">お知らせはまだありません</div>'; return; }
  el.innerHTML = snap.docs.map(doc => {
    const d = doc.data();
    return `<a class="widget-row" href="notices.html">
      <span class="wr-icon">${d.tag === 'NEW' ? '🆕' : '📢'}</span>
      <div class="wr-text"><div class="jp">${escapeHtml(d.title)}</div></div>
      <span class="wr-date">${fmtDate(d.createdAt)}</span>
    </a>`;
  }).join('');
}).catch(() => { document.getElementById('widgetNotices').innerHTML = '<div class="home-empty-mini">読み込みに失敗しました</div>'; });

// 최신 마화 2건
db.collection('manga').orderBy('createdAt', 'desc').limit(2).get().then(snap => {
  const el = document.getElementById('widgetManga');
  if (snap.empty) { el.innerHTML = '<div class="home-empty-mini">準備中です</div>'; return; }
  el.innerHTML = snap.docs.map(doc => {
    const d = doc.data();
    return `<a class="widget-row" href="manga-detail.html?id=${doc.id}">
      <img class="wr-thumb" src="${d.img || 'koara_logo.png'}" onerror="this.src='koara_logo.png'">
      <div class="wr-text"><div class="jp">#${escapeHtml(d.ep)} ${escapeHtml(d.title)}</div></div>
      <span class="wr-date">${fmtDate(d.createdAt)}</span>
    </a>`;
  }).join('');
}).catch(() => { document.getElementById('widgetManga').innerHTML = '<div class="home-empty-mini">読み込みに失敗しました</div>'; });

// 최신 플래시카드 세트 3건
db.collection('flashcardSets').orderBy('createdAt', 'desc').limit(3).get().then(snap => {
  const el = document.getElementById('widgetCards');
  if (snap.empty) { el.innerHTML = '<div class="home-empty-mini">準備中です</div>'; return; }
  el.innerHTML = snap.docs.map(doc => {
    const d = doc.data();
    const count = (d.cards || []).length;
    return `<a class="widget-row" href="flashcards-detail.html?id=${doc.id}">
      <span class="wr-icon">🗂️</span>
      <div class="wr-text"><div class="jp">${escapeHtml(d.title)}</div><div class="kr">${escapeHtml(d.desc || '')}</div></div>
      <span class="wr-date">${count}枚</span>
    </a>`;
  }).join('');
}).catch(() => { document.getElementById('widgetCards').innerHTML = '<div class="home-empty-mini">読み込みに失敗しました</div>'; });

// 최신 자료실 3건
db.collection('materials').orderBy('createdAt', 'desc').limit(3).get().then(snap => {
  const el = document.getElementById('widgetMaterials');
  if (snap.empty) { el.innerHTML = '<div class="home-empty-mini">準備中です</div>'; return; }
  el.innerHTML = snap.docs.map(doc => {
    const d = doc.data();
    return `<a class="widget-row" href="${d.link || 'materials.html'}" target="${d.link ? '_blank' : '_self'}">
      <span class="wr-icon">📄</span>
      <div class="wr-text"><div class="jp">${escapeHtml(d.title)}</div></div>
    </a>`;
  }).join('');
}).catch(() => { document.getElementById('widgetMaterials').innerHTML = '<div class="home-empty-mini">読み込みに失敗しました</div>'; });
</script>
</body>
</html>
