<meta charset="UTF-8">

<title>단어 격파 · 휴식·목욕</title>
<style>
  :root{
    --sky-top:#AEE3FF;
    --sky-mid:#CDEFFF;
    --sky-bottom:#F2FBFF;
    --mint:#5FE0C1;
    --mint-dark:#28B896;
    --coral:#FFB199;
    --gold:#FFDD6A;
    --plum:#4A3B78;
    --plum-soft:#8177B3;
    --card:#FFFFFF;
    --key-shadow:#d8d3ee;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;}
  body{
    background:linear-gradient(180deg,var(--sky-top) 0%, var(--sky-bottom) 100%);
    display:flex; justify-content:center; align-items:center;
    height:100vh; width:100vw;
    height:100dvh;
    height:var(--app-vh, 100dvh);
    user-select:none;
  }
  #app{
    width:100%; max-width:480px; height:100%; max-height:900px;
    max-height:min(900px, 100dvh);
    max-height:min(900px, var(--app-vh, 100dvh));
    display:flex; flex-direction:column;
    position:relative;
    background: linear-gradient(180deg,var(--sky-top) 0%, var(--sky-mid) 45%, var(--sky-bottom) 100%);
    box-shadow:0 0 40px rgba(0,0,0,0.15);
    overflow:hidden;
  }

  /* fluffy clouds */
  .cloud{position:absolute; pointer-events:none; z-index:1; animation:drift linear infinite;}
  .cloud .puff{
    position:absolute; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #ffffff 0%, #ffffff 55%, #E8F4FB 85%, #DCEEF8 100%);
    box-shadow:0 6px 14px rgba(150,190,220,0.25);
  }
  @keyframes drift{from{transform:translateX(-160px);}to{transform:translateX(calc(100vw + 160px));}}
  @media (prefers-reduced-motion: reduce){ .cloud{animation:none;} }

  /* top bar */
  #topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 12px 6px 12px; position:relative; z-index:5; gap:8px;
  }
  #hearts{display:flex; gap:3px;}
  .heart{font-size:20px; filter:drop-shadow(0 2px 2px rgba(0,0,0,0.15)); transition:transform .25s;}
  .heart.lost{opacity:0.25; transform:scale(0.8);}
  .pill{
    background:rgba(255,255,255,0.8); border-radius:20px; padding:5px 12px;
    font-weight:800; color:var(--plum); font-size:15px; letter-spacing:0.5px;
    box-shadow:0 2px 6px rgba(0,0,0,0.08);
    display:flex; align-items:center; gap:5px; white-space:nowrap;
  }

  /* game area */
  #gamewrap{flex:1; position:relative; overflow:hidden;}
  #floor-line{
    position:absolute; left:0; right:0; bottom:0; height:2px;
    background:repeating-linear-gradient(90deg, rgba(74,59,120,0.25) 0 10px, transparent 10px 20px);
  }

  /* ---------- hot-air balloon unit ---------- */
  .bunit{
    position:absolute; transform:translate(-50%,0); z-index:3;
    display:flex; flex-direction:column; align-items:center;
  }
  .bln{
    position:relative;
    padding:13px 17px 15px 17px; min-width:58px;
    border-radius:50% 50% 46% 46% / 55% 55% 45% 45%;
    background:linear-gradient(160deg, var(--bl) 0%, var(--bc) 70%);
    border:2px solid rgba(255,255,255,0.65);
    box-shadow:0 4px 10px rgba(0,0,0,0.12), inset 0 3px 4px rgba(255,255,255,0.55);
    font-weight:800; font-size:21px; color:var(--bt);
    text-align:center; white-space:nowrap; line-height:1;
  }
  .bln::after{
    content:''; position:absolute; left:50%; bottom:-7px; transform:translateX(-50%);
    border:5px solid transparent; border-top:7px solid var(--bc);
  }
  .bstr{display:block; margin-top:-1px;}
  .bsk{
    padding:3px 11px 5px 11px;
    background:linear-gradient(180deg,#F3D9A8,#DDB474);
    border:1.5px solid #C89B57; border-radius:6px;
    box-shadow:inset 0 -3px 0 rgba(120,80,20,0.15), 0 2px 5px rgba(0,0,0,0.12);
    font-size:14px; font-weight:800; color:#6B4A1B;
    white-space:nowrap; line-height:1.3;
  }
  .bunit.popping .bln{animation:blnpop .26s ease-out forwards;}
  .bunit.popping .bln::after{display:none;}
  .bunit.popping .bstr{animation:fadeout .25s forwards;}
  .bunit.popping .bsk{opacity:0;}
  @keyframes blnpop{
    0%{transform:scale(1); opacity:1;}
    40%{transform:scale(1.14); opacity:.8;}
    100%{transform:scale(1.2); opacity:0;}
  }
  @keyframes fadeout{to{opacity:0;}}

  /* parachute for the basket */
  .chute{
    position:absolute; transform:translate(-50%,0); z-index:4;
    display:flex; flex-direction:column; align-items:center;
    pointer-events:none;
    animation:chutefall 1.6s ease-in forwards;
  }
  .chute .canopy{
    width:48px; height:23px;
    border-radius:24px 24px 5px 5px;
    background:repeating-linear-gradient(90deg, var(--cl,#FFE0E9) 0 9px, var(--cc,#FFC9D6) 9px 18px);
    border:1.5px solid rgba(0,0,0,0.12); border-bottom:none;
    box-shadow:inset 0 3px 3px rgba(255,255,255,0.5);
    animation:canopyin .22s ease-out;
    transform-origin:bottom center;
  }
  @keyframes canopyin{from{transform:scale(0);}to{transform:scale(1);}}
  .chute .clines{display:block; margin-top:-1px;}
  .chute .cbsk{
    padding:3px 11px 5px 11px;
    background:linear-gradient(180deg,#F3D9A8,#DDB474);
    border:1.5px solid #C89B57; border-radius:6px;
    box-shadow:inset 0 -3px 0 rgba(120,80,20,0.15), 0 2px 5px rgba(0,0,0,0.12);
    font-size:14px; font-weight:800; color:#6B4A1B;
    white-space:nowrap; line-height:1.3;
  }
  @keyframes chutefall{
    0%{transform:translate(-50%,0) rotate(0deg); opacity:1;}
    25%{transform:translate(-50%,16px) rotate(-4deg); opacity:1;}
    50%{transform:translate(-50%,34px) rotate(4deg); opacity:1;}
    75%{transform:translate(-50%,52px) rotate(-3deg); opacity:.9;}
    100%{transform:translate(-50%,72px) rotate(2deg); opacity:0;}
  }

  .confetti{
    position:absolute; width:7px; height:11px; border-radius:2px; z-index:4;
    pointer-events:none;
    animation:confall .95s cubic-bezier(.25,.6,.5,1) forwards;
  }
  @keyframes confall{
    0%{transform:translate(-50%,-50%) translate(0,0) rotate(0deg); opacity:1;}
    75%{opacity:1;}
    100%{transform:translate(-50%,-50%) translate(var(--cx), 78px) rotate(var(--cr)); opacity:0;}
  }

  .food{
    position:absolute; z-index:2; pointer-events:none;
    animation:foodbob ease-in-out infinite;
    filter:drop-shadow(0 3px 4px rgba(120,160,200,0.25));
    opacity:.9;
  }
  @keyframes foodbob{
    0%,100%{transform:translateY(0) rotate(-3deg);}
    50%{transform:translateY(-9px) rotate(3deg);}
  }
  @media (prefers-reduced-motion: reduce){ .food{animation:none;} }

  .heartbonus{
    position:absolute; font-size:30px; transform:translate(-50%,0); z-index:3;
    filter:drop-shadow(0 3px 4px rgba(0,0,0,0.2));
    cursor:pointer; animation:pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{transform:translate(-50%,0) scale(1);}50%{transform:translate(-50%,0) scale(1.15);}}

  .popscore{
    position:absolute; font-weight:900; color:#F5A800; font-size:20px; z-index:4;
    text-shadow:0 1px 2px rgba(0,0,0,0.25);
    animation:floatup .8s ease-out forwards; pointer-events:none;
  }
  @keyframes floatup{from{opacity:1; transform:translate(-50%,0);}to{opacity:0; transform:translate(-50%,-50px);}}

  .particle{
    position:absolute; width:8px; height:8px; border-radius:50%; z-index:4;
    pointer-events:none; animation:burst .5s ease-out forwards;
  }
  @keyframes burst{
    from{transform:translate(-50%,-50%) scale(1); opacity:1;}
    to{transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0.2); opacity:0;}
  }

  /* bottom panel */
  #bottompanel{
    position:relative; z-index:5;
    background:rgba(255,255,255,0.55);
    backdrop-filter:blur(6px);
    padding:10px 10px calc(12px + env(safe-area-inset-bottom, 0px) + 22px) 10px;
    border-top:2px solid rgba(255,255,255,0.6);
  }
  #composebox{
    height:46px; border-radius:14px;
    background:var(--card);
    box-shadow:inset 0 2px 5px rgba(0,0,0,0.08);
    display:flex; align-items:center; justify-content:center;
    font-size:24px; font-weight:800; color:var(--plum);
    margin-bottom:8px; letter-spacing:2px;
    transition:background .15s;
  }
  #composebox.err{background:#FFE1E1; animation:errshake .25s;}
  #composebox.hit{background:#DFF7EC; color:#0B5F49;}
  @keyframes errshake{0%,100%{transform:translateX(0);}30%{transform:translateX(-5px);}70%{transform:translateX(5px);}}
  .caret{display:inline-block; width:2px; height:22px; background:var(--plum-soft); margin-left:2px; animation:blink 1s step-start infinite; vertical-align:middle;}
  @keyframes blink{50%{opacity:0;}}

  #keyboard{display:flex; flex-direction:column; gap:6px;}
  .krow{display:flex; gap:4px; justify-content:center;}
  .key{
    flex:1; max-width:44px; height:46px;
    background:linear-gradient(160deg,#ffffff,#EDEBFA);
    border:none; border-radius:10px;
    box-shadow:0 3px 0 var(--key-shadow), 0 3px 6px rgba(0,0,0,0.08);
    font-size:18px; font-weight:800; color:var(--plum);
    display:flex; align-items:center; justify-content:center;
    transition:transform .05s, box-shadow .05s;
    touch-action:manipulation;
  }
  .key:active, .key.pressed{
    transform:translateY(3px);
    box-shadow:0 0 0 var(--key-shadow), 0 1px 2px rgba(0,0,0,0.08);
  }
  .key.wide{max-width:66px; font-size:15px;}
  .key.shiftkey{background:linear-gradient(160deg,#FFE9A8,var(--gold)); color:#6B4E00;}
  .key.shiftkey.active{background:linear-gradient(160deg,var(--gold),#F0B93A);}
  .key.backspace{background:linear-gradient(160deg,#FFCFC2,var(--coral)); color:#7A2E10; font-size:16px;}

  /* overlays */
  #overlay{
    position:absolute; inset:0; z-index:20;
    background:rgba(74,59,120,0.85);
    display:none; flex-direction:column; align-items:center; justify-content:center;
    color:#fff; text-align:center; padding:24px;
  }
  #overlay .big{font-size:52px; margin:0 0 10px 0;}
  #overlay p{margin:4px 0; font-size:24px; opacity:0.95; font-weight:800;}
  #overlay button{
    margin-top:22px; padding:14px 34px; border:none; border-radius:26px;
    background:var(--gold); color:#5B4300; font-weight:800; font-size:22px;
    box-shadow:0 4px 0 #C99A1E;
  }
  #overlay button:active{transform:translateY(3px); box-shadow:0 1px 0 #C99A1E;}

  /* start screen */
  #starttap{
    position:absolute; inset:0; z-index:25; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    background:linear-gradient(180deg,var(--sky-top),var(--sky-bottom));
    gap:16px;
  }
  #title-dart{position:relative; display:flex; align-items:center; gap:10px; margin-bottom:-4px; z-index:2;}
  #title-dart .dart{
    font-size:62px;
    filter:drop-shadow(0 6px 10px rgba(120,160,200,0.4));
    animation:dartbounce 2.2s ease-in-out infinite;
    display:inline-block;
  }
  @keyframes dartbounce{0%,100%{transform:translateY(0) rotate(-6deg);}50%{transform:translateY(-10px) rotate(6deg);}}
  #title-dart .spark{font-size:22px; opacity:0.85; animation:sparkle 1.6s ease-in-out infinite;}
  #title-dart .s2{animation-delay:0.8s;}
  @keyframes sparkle{0%,100%{transform:scale(0.7); opacity:0.4;}50%{transform:scale(1.2); opacity:1;}}
  /* full-screen oblique rainbow */
  #rainbowwrap{
    position:absolute; z-index:0; pointer-events:none;
    width:150%; height:78%;
    left:-25%; top:2%;
    transform:rotate(-14deg);
    opacity:.75;
  }
  #rainbowwrap svg{width:100%; height:100%;}

  /* big fluffy clouds */
  .bigcloud{position:absolute; z-index:1; pointer-events:none; animation:decofloat 6s ease-in-out infinite;}
  .bigcloud .puff{
    position:absolute; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #ffffff 0%, #ffffff 55%, #E8F4FB 85%, #DCEEF8 100%);
    box-shadow:0 8px 18px rgba(150,190,220,0.3);
  }
  .bc1{left:-6%; bottom:14%; width:190px; height:100px; animation-delay:0s;}
  .bc2{right:-5%; top:9%; width:130px; height:80px; animation-delay:1.6s;}
  .bc3{right:6%; bottom:8%; width:100px; height:62px; animation-delay:3s; opacity:.9;}
  @keyframes decofloat{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-12px);}
  }
  #title-dart, #demo, #startbtn{position:relative; z-index:2;}
  @media (prefers-reduced-motion: reduce){
    #title-dart .dart, #title-dart .spark, .bigcloud{animation:none;}
  }

  #demo{
    width:min(320px, 84vw); height:310px; position:relative;
    background:rgba(255,255,255,0.55); border-radius:24px;
    box-shadow:0 6px 20px rgba(120,160,200,0.25), inset 0 2px 4px rgba(255,255,255,0.8);
    overflow:hidden;
  }
  #demo .dunit{position:absolute; transform:translate(-50%,0); display:flex; flex-direction:column; align-items:center;}
  #demo .dbln{
    padding:9px 13px 11px 13px; border-radius:50% 50% 46% 46% / 55% 55% 45% 45%;
    background:linear-gradient(160deg,#FFE0E9,#FFC9D6);
    border:2px solid rgba(255,255,255,0.65);
    box-shadow:0 3px 8px rgba(0,0,0,0.12);
    font-weight:800; font-size:18px; color:#8E2B4A; line-height:1; position:relative;
  }
  #demo .dbln::after{content:''; position:absolute; left:50%; bottom:-6px; transform:translateX(-50%); border:4px solid transparent; border-top:6px solid #FFC9D6;}
  #demo .dbsk{
    margin-top:8px; padding:2px 9px 4px 9px;
    background:linear-gradient(180deg,#F3D9A8,#DDB474);
    border:1.5px solid #C89B57; border-radius:5px;
    font-size:12px; font-weight:800; color:#6B4A1B;
  }
  #demo .dheart{position:absolute; font-size:26px; transform:translate(-50%,0);}
  #demo .dhand{position:absolute; font-size:26px; transform:translate(-30%,-10%); opacity:0; transition:opacity .2s;}
  #demo #dcompose{
    position:absolute; left:12px; right:12px; bottom:64px; height:38px;
    background:#fff; border-radius:12px;
    box-shadow:inset 0 2px 4px rgba(0,0,0,0.08);
    display:flex; align-items:center; justify-content:center;
    font-size:20px; font-weight:800; color:var(--plum); letter-spacing:2px;
  }
  #demo #dkeys{position:absolute; left:12px; right:12px; bottom:12px; height:42px; display:flex; gap:6px; justify-content:center;}
  #demo .dkey{
    width:42px; height:42px; border-radius:9px;
    background:linear-gradient(160deg,#ffffff,#EDEBFA);
    box-shadow:0 2px 0 var(--key-shadow);
    display:flex; align-items:center; justify-content:center;
    font-size:17px; font-weight:800; color:var(--plum);
    transition:transform .08s, background .08s;
  }
  #demo .dkey.hit{transform:translateY(2px); background:linear-gradient(160deg,var(--gold),#FFE9A8); box-shadow:0 0 0 var(--key-shadow);}
  #demo .dpop{position:absolute; transform:translate(-50%,-50%); font-size:26px; animation:dpopanim .55s ease-out forwards;}
  @keyframes dpopanim{0%{transform:translate(-50%,-50%) scale(0.4); opacity:1;}100%{transform:translate(-50%,-50%) scale(1.6); opacity:0;}}
  #demo .dheartrow{position:absolute; top:10px; left:12px; font-size:16px; letter-spacing:2px;}

  #startbtn{
    padding:16px 46px; border:none; border-radius:30px;
    background:linear-gradient(160deg,#8CF3D6,var(--mint));
    color:#0B4F42; font-weight:900; font-size:26px;
    box-shadow:0 5px 0 var(--mint-dark);
  }
  #startbtn:active{transform:translateY(4px); box-shadow:0 1px 0 var(--mint-dark);}
</style>
</head>

<script>
(function(){
  "use strict";

  /* Mobile viewport-height fix: 100vh/100dvh can still misbehave on some
     mobile browsers when the address bar or on-screen keyboard shows/hides,
     clipping the bottom keyboard. Track the real visible height in JS. */
  function setAppVH(){
    const h = (window.visualViewport ? window.visualViewport.height : window.innerHeight);
    document.documentElement.style.setProperty('--app-vh', h + 'px');
  }
  setAppVH();
  window.addEventListener('resize', setAppVH);
  window.addEventListener('orientationchange', setAppVH);
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize', setAppVH);
  }

  /* ---------------- DATA (휴식·목욕) ---------------- */
  const WORDS = [
    ["휴식","休息"],["목욕","入浴"],["욕조","浴槽"],["칫솔","歯ブラシ"],["치약","歯磨き粉"],
    ["온천","温泉"],["찜질방","チムジルバン"],["이불","布団"],["베개","枕"],["낮잠","昼寝"],
    ["휴가","休暇"],["피곤해요","疲れます"],["개운해요","すっきりします"],["쉬어요","休みます"],["누워요","横になります"],
    ["발마사지","足マッサージ"],["반신욕","半身浴"],["힐링","ヒーリング"],["명상","瞑想"],["뒹굴뒹굴해요","ゴロゴロします"]
  ];
  const TOTAL = WORDS.length;

  /* balloon color schemes: --bl (light), --bc (core), --bt (text) */
  const SCHEMES = [
    {bl:'#FFE0E9', bc:'#FFC9D6', bt:'#8E2B4A'},
    {bl:'#D8F8EC', bc:'#BDEFDD', bt:'#0B5F49'},
    {bl:'#FFF3C9', bc:'#FFE9A8', bt:'#7A5A00'},
    {bl:'#EAE4FF', bc:'#DCD4FF', bt:'#4A3B78'},
    {bl:'#DFF2FF', bc:'#C7E8FF', bt:'#134D74'}
  ];

  /* ---------------- HANGUL TABLES ---------------- */
  const CHO_LIST  = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
  const JUNG_LIST = ['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
  const JONG_LIST = ['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
  const VOWEL_COMBINE = {'ㅗㅏ':'ㅘ','ㅗㅐ':'ㅙ','ㅗㅣ':'ㅚ','ㅜㅓ':'ㅝ','ㅜㅔ':'ㅞ','ㅜㅣ':'ㅟ','ㅡㅣ':'ㅢ'};
  const JUNG_KEYS = {'ㅘ':['ㅗ','ㅏ'],'ㅙ':['ㅗ','ㅐ'],'ㅚ':['ㅗ','ㅣ'],'ㅝ':['ㅜ','ㅓ'],'ㅞ':['ㅜ','ㅔ'],'ㅟ':['ㅜ','ㅣ'],'ㅢ':['ㅡ','ㅣ']};
  const JONG_KEYS = {'ㄳ':['ㄱ','ㅅ'],'ㄵ':['ㄴ','ㅈ'],'ㄶ':['ㄴ','ㅎ'],'ㄺ':['ㄹ','ㄱ'],'ㄻ':['ㄹ','ㅁ'],'ㄼ':['ㄹ','ㅂ'],'ㄽ':['ㄹ','ㅅ'],'ㄾ':['ㄹ','ㅌ'],'ㄿ':['ㄹ','ㅍ'],'ㅀ':['ㄹ','ㅎ'],'ㅄ':['ㅂ','ㅅ']};
  const COMBINE_JONG = {};
  Object.keys(JONG_KEYS).forEach(k=>{ const [a,b]=JONG_KEYS[k]; COMBINE_JONG[a+b]=k; });
  const SINGLE_JONG = {'ㄱ':1,'ㄲ':2,'ㄴ':4,'ㄷ':7,'ㄹ':8,'ㅁ':16,'ㅂ':17,'ㅅ':19,'ㅆ':20,'ㅇ':21,'ㅈ':22,'ㅊ':23,'ㅋ':24,'ㅌ':25,'ㅍ':26,'ㅎ':27};

  function isCho(j){ return CHO_LIST.indexOf(j) !== -1; }
  function isJung(j){ return JUNG_LIST.indexOf(j) !== -1; }

  function wordToJamo(word){
    const out = [];
    for(const ch of word){
      if(ch === ' ') continue;
      const code = ch.charCodeAt(0);
      if(code >= 0xAC00 && code <= 0xD7A3){
        const rel = code - 0xAC00;
        out.push(CHO_LIST[Math.floor(rel/(21*28))]);
        const jung = JUNG_LIST[Math.floor(rel/28)%21];
        (JUNG_KEYS[jung]||[jung]).forEach(j=>out.push(j));
        const jong = JONG_LIST[rel%28];
        if(jong) (JONG_KEYS[jong]||[jong]).forEach(j=>out.push(j));
      } else out.push(ch);
    }
    return out.join('');
  }
  const WORD_JAMO = WORDS.map(w=>wordToJamo(w[0]));

  /* ---------------- COMPOSER ---------------- */
  const Composer = {
    composed:'', cur:{cho:null,jung:null,jong:null}, hist:[], jamoSeq:[],
    pushHist(){ this.hist.push({composed:this.composed, cur:{...this.cur}}); },
    curChar(){
      const c = this.cur;
      if(!c.cho && !c.jung) return '';
      if(c.cho && !c.jung) return c.cho;
      if(!c.cho && c.jung) return c.jung;
      const choIdx = CHO_LIST.indexOf(c.cho);
      const jungIdx = JUNG_LIST.indexOf(c.jung);
      const jongIdx = c.jong ? JONG_LIST.indexOf(c.jong) : 0;
      return String.fromCharCode(0xAC00 + (choIdx*21 + jungIdx)*28 + jongIdx);
    },
    text(){ return this.composed + this.curChar(); },
    add(jamo){
      this.pushHist();
      this.jamoSeq.push(jamo);
      const c = this.cur;
      if(isCho(jamo)){
        if(!c.cho){ c.cho = jamo; }
        else if(!c.jung){ this.composed += this.curChar(); this.cur = {cho:jamo,jung:null,jong:null}; }
        else if(!c.jong){
          if(SINGLE_JONG[jamo] !== undefined){ c.jong = jamo; }
          else { this.composed += this.curChar(); this.cur = {cho:jamo,jung:null,jong:null}; }
        } else {
          const combo = COMBINE_JONG[c.jong+jamo];
          if(combo){ c.jong = combo; }
          else { this.composed += this.curChar(); this.cur = {cho:jamo,jung:null,jong:null}; }
        }
      } else if(isJung(jamo)){
        if(c.jong){
          const parts = JONG_KEYS[c.jong];
          if(parts){
            c.jong = parts[0];
            this.composed += this.curChar();
            this.cur = {cho:parts[1], jung:jamo, jong:null};
          } else {
            const moved = c.jong; c.jong = null;
            this.composed += this.curChar();
            this.cur = {cho:moved, jung:jamo, jong:null};
          }
        } else if(c.jung){
          const combo = VOWEL_COMBINE[c.jung+jamo];
          if(combo){ c.jung = combo; }
          else { this.composed += this.curChar(); this.cur = {cho:null,jung:jamo,jong:null}; }
        } else if(c.cho){
          c.jung = jamo;
        } else {
          this.composed += this.curChar();
          this.cur = {cho:null,jung:jamo,jong:null};
        }
      }
    },
    backspace(){
      if(this.hist.length){
        const p = this.hist.pop();
        this.composed = p.composed; this.cur = p.cur;
        this.jamoSeq.pop();
      }
    },
    clear(){ this.hist = []; this.composed=''; this.cur={cho:null,jung:null,jong:null}; this.jamoSeq=[]; }
  };

  /* ---------------- KEYBOARD ---------------- */
  const KEY_MAP = {
    KeyQ:{n:'ㅂ',s:'ㅃ'}, KeyW:{n:'ㅈ',s:'ㅉ'}, KeyE:{n:'ㄷ',s:'ㄸ'}, KeyR:{n:'ㄱ',s:'ㄲ'}, KeyT:{n:'ㅅ',s:'ㅆ'},
    KeyY:{n:'ㅛ'}, KeyU:{n:'ㅕ'}, KeyI:{n:'ㅑ'}, KeyO:{n:'ㅐ',s:'ㅒ'}, KeyP:{n:'ㅔ',s:'ㅖ'},
    KeyA:{n:'ㅁ'}, KeyS:{n:'ㄴ'}, KeyD:{n:'ㅇ'}, KeyF:{n:'ㄹ'}, KeyG:{n:'ㅎ'}, KeyH:{n:'ㅗ'}, KeyJ:{n:'ㅓ'}, KeyK:{n:'ㅏ'}, KeyL:{n:'ㅣ'},
    KeyZ:{n:'ㅋ'}, KeyX:{n:'ㅌ'}, KeyC:{n:'ㅊ'}, KeyV:{n:'ㅍ'}, KeyB:{n:'ㅠ'}, KeyN:{n:'ㅜ'}, KeyM:{n:'ㅡ'}
  };
  const ROWS = [
    ['KeyQ','KeyW','KeyE','KeyR','KeyT','KeyY','KeyU','KeyI','KeyO','KeyP'],
    ['KeyA','KeyS','KeyD','KeyF','KeyG','KeyH','KeyJ','KeyK','KeyL'],
    ['SHIFT','KeyZ','KeyX','KeyC','KeyV','KeyB','KeyN','KeyM','BACK']
  ];
  let shiftOn = false;

  const keyboardEl = document.getElementById('keyboard');
  const keyEls = {};
  ROWS.forEach(row=>{
    const rowEl = document.createElement('div'); rowEl.className='krow';
    row.forEach(code=>{
      const btn = document.createElement('button'); btn.className='key'; btn.type='button';
      if(code === 'SHIFT'){ btn.classList.add('shiftkey','wide'); btn.textContent = '⇧'; btn.dataset.code='SHIFT'; }
      else if(code === 'BACK'){ btn.classList.add('backspace','wide'); btn.textContent = '⌫'; btn.dataset.code='BACK'; }
      else { btn.textContent = KEY_MAP[code].n; btn.dataset.code = code; }
      rowEl.appendChild(btn);
      keyEls[code] = btn;
    });
    keyboardEl.appendChild(rowEl);
  });

  function flashKey(code){
    const el = keyEls[code];
    if(el){ el.classList.add('pressed'); setTimeout(()=>el.classList.remove('pressed'),90); }
  }
  let inputLocked = false;
  function pressKey(code, forceShift){
    if(inputLocked) return;
    flashKey(code);
    if(code === 'SHIFT'){
      shiftOn = !shiftOn;
      keyEls.SHIFT.classList.toggle('active', shiftOn);
      refreshKeyLabels();
      return;
    }
    if(code === 'BACK'){ Composer.backspace(); onComposeChanged(); return; }
    const map = KEY_MAP[code]; if(!map) return;
    const useShift = (forceShift !== undefined) ? forceShift : shiftOn;
    const jamo = (useShift && map.s) ? map.s : map.n;
    if(shiftOn && forceShift === undefined){ shiftOn=false; keyEls.SHIFT.classList.remove('active'); refreshKeyLabels(); }
    Composer.add(jamo);
    onComposeChanged();
  }
  function refreshKeyLabels(){
    Object.keys(KEY_MAP).forEach(code=>{
      const map = KEY_MAP[code];
      keyEls[code].textContent = (shiftOn && map.s) ? map.s : map.n;
    });
  }
  keyboardEl.addEventListener('pointerdown', e=>{
    const btn = e.target.closest('.key'); if(!btn) return;
    e.preventDefault();
    pressKey(btn.dataset.code);
  });
  document.addEventListener('keydown', e=>{
    if(!gameRunning) return;
    if(e.code === 'Backspace'){ e.preventDefault(); pressKey('BACK'); return; }
    if(KEY_MAP[e.code]){
      e.preventDefault();
      pressKey(e.code, e.shiftKey);
    }
  });

  const composeBox = document.getElementById('composebox');
  function renderCompose(){
    composeBox.innerHTML = escapeHtml(Composer.text()) + '<span class="caret"></span>';
  }
  function onComposeChanged(){ renderCompose(); checkMatch(); }
  function escapeHtml(s){ return s.replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

  /* ---------------- AUDIO ---------------- */
  let actx = null;
  function ctx(){ if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)(); return actx; }
  function tone(freq, dur, type, gainStart, delay){
    delay = delay||0;
    const c = ctx();
    const t0 = c.currentTime + delay;
    const osc = c.createOscillator(); const gain = c.createGain();
    osc.type = type||'sine'; osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(gainStart||0.2, t0);
    gain.gain.exponentialRampToValueAtTime(0.001, t0+dur);
    osc.connect(gain); gain.connect(c.destination);
    osc.start(t0); osc.stop(t0+dur+0.02);
  }
  function playPop(){ tone(660,0.09,'triangle',0.22); tone(990,0.12,'triangle',0.16,0.05); }
  function playErr(){ tone(200,0.12,'square',0.06); }
  function playHeartLose(){ tone(220,0.25,'sawtooth',0.15); tone(160,0.3,'sawtooth',0.12,0.08); }
  function playHeartGain(){ tone(523,0.1,'sine',0.2); tone(659,0.1,'sine',0.2,0.09); tone(784,0.16,'sine',0.2,0.18); }
  function playGameOver(){ [523,440,392,330].forEach((f,i)=>tone(f,0.35,'sine',0.18,i*0.18)); }
  function playClear(){ [523,659,784,1047].forEach((f,i)=>tone(f,0.28,'triangle',0.2,i*0.15)); tone(1319,0.5,'triangle',0.18,0.6); }

  /* ---------------- GAME STATE ---------------- */
  const gamewrap = document.getElementById('gamewrap');
  const heartsEl = document.getElementById('hearts');
  const scoreValEl = document.getElementById('scoreval');
  const progressEl = document.getElementById('progressval');
  document.getElementById('progresstotal').textContent = TOTAL;
  const overlay = document.getElementById('overlay');
  const startTap = document.getElementById('starttap');

  let hearts = 5, score = 0, cleared = 0, gameRunning = false;
  let balloons = [];
  let bonuses = [];
  let queue = [];
  let unitId = 0;
  let lastWave = 0, waveInterval = 5600;
  let lastBonus = 0, bonusInterval = 17000;

  function initHearts(){
    heartsEl.innerHTML = '';
    for(let i=0;i<5;i++){
      const s = document.createElement('span'); s.className='heart'; s.textContent='❤️';
      heartsEl.appendChild(s);
    }
  }
  function renderHearts(){
    heartsEl.querySelectorAll('.heart').forEach((el,i)=> el.classList.toggle('lost', i >= hearts));
  }
  function addScore(n){ score += n; scoreValEl.textContent = score; }
  function renderProgress(){ progressEl.textContent = cleared; }

  function shuffledIndices(){
    const a = WORDS.map((_,i)=>i);
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }

  function spawnWave(){
    const areaW = gamewrap.clientWidth;
    const cols = [0.2, 0.5, 0.8].sort(()=>Math.random()-0.5);
    const n = Math.min(3, queue.length);
    for(let i=0;i<n;i++){
      const idx = queue.shift();
      const x = cols[i]*areaW + (Math.random()*24-12);
      const y = -150 - i*150 - Math.random()*60;
      const speed = 26 + Math.random()*8;
      createBalloon(idx, x, y, speed);
    }
  }

  function createBalloon(wordIdx, x, y, speed){
    const [kr, jp] = WORDS[wordIdx];
    const sch = SCHEMES[Math.floor(Math.random()*SCHEMES.length)];
    const unit = document.createElement('div');
    unit.className = 'bunit';
    unit.style.setProperty('--bl', sch.bl);
    unit.style.setProperty('--bc', sch.bc);
    unit.style.setProperty('--bt', sch.bt);
    unit.style.left = x+'px';
    unit.style.top = y+'px';

    const bln = document.createElement('div'); bln.className='bln'; bln.textContent = kr;
    const str = document.createElementNS('http://www.w3.org/2000/svg','svg');
    str.setAttribute('class','bstr'); str.setAttribute('width','44'); str.setAttribute('height','14');
    str.innerHTML = '<line x1="12" y1="0" x2="16" y2="14" stroke="#A98F63" stroke-width="1.4"/><line x1="32" y1="0" x2="28" y2="14" stroke="#A98F63" stroke-width="1.4"/>';
    const bsk = document.createElement('div'); bsk.className='bsk'; bsk.textContent = jp;

    unit.appendChild(bln); unit.appendChild(str); unit.appendChild(bsk);
    gamewrap.appendChild(unit);

    balloons.push({id:++unitId, wordIdx, jamo:WORD_JAMO[wordIdx], x, y, speed, sch, el:unit, active:true});
  }

  function spawnBonus(){
    const areaW = gamewrap.clientWidth;
    const x = 20 + Math.random()*(areaW-40);
    const el = document.createElement('div');
    el.className = 'heartbonus'; el.textContent = '💗';
    el.style.left = x+'px'; el.style.top = '-40px';
    gamewrap.appendChild(el);
    const b = {x, y:-40, speed:20+Math.random()*6, el, active:true};
    el.addEventListener('pointerdown', ()=> catchBonus(b));
    bonuses.push(b);
  }
  function catchBonus(b){
    if(!b.active) return;
    b.active = false;
    burstParticles(b.x, b.y, ['#FF7FA6','#FFD1E3','#fff']);
    b.el.remove();
    bonuses = bonuses.filter(x=>x!==b);
    if(hearts < 5){ hearts++; renderHearts(); }
    playHeartGain();
  }

  function burstParticles(x,y,colors){
    for(let i=0;i<12;i++){
      const p = document.createElement('div'); p.className='particle';
      const ang = Math.random()*Math.PI*2; const dist = 22+Math.random()*34;
      p.style.setProperty('--dx',(Math.cos(ang)*dist)+'px');
      p.style.setProperty('--dy',(Math.sin(ang)*dist)+'px');
      p.style.left = x+'px'; p.style.top = y+'px';
      p.style.background = colors[Math.floor(Math.random()*colors.length)];
      gamewrap.appendChild(p);
      setTimeout(()=>p.remove(),520);
    }
  }
  function popScoreText(x,y,txt){
    const s = document.createElement('div'); s.className='popscore'; s.textContent = txt;
    s.style.left = x+'px'; s.style.top = y+'px';
    gamewrap.appendChild(s);
    setTimeout(()=>s.remove(),820);
  }

  function checkMatch(){
    const typed = Composer.jamoSeq.join('').replace(/\s/g, '');
    if(!typed) return;
    const hit = balloons.find(b=>b.active && b.jamo === typed);
    if(hit){
      popBalloon(hit);
      inputLocked = true;
      composeBox.classList.add('hit');
      setTimeout(()=>{
        composeBox.classList.remove('hit');
        Composer.clear();
        renderCompose();
        inputLocked = false;
      }, 260);
      return;
    }
    const anyPrefix = balloons.some(b=>b.active && b.jamo.startsWith(typed));
    if(!anyPrefix){
      playErr();
      composeBox.classList.add('err');
      setTimeout(()=>composeBox.classList.remove('err'), 260);
      Composer.clear();
      setTimeout(renderCompose, 200);
    }
  }

  const CONFETTI_COLORS = ['#5DCAA5','#FAC775','#ED93B1','#85B7EB','#AFA9EC','#F09595','#FFDD6A'];
  function confettiBurst(x, y){
    for(let i=0;i<14;i++){
      const c = document.createElement('div'); c.className='confetti';
      c.style.left = x+'px'; c.style.top = y+'px';
      c.style.setProperty('--cx', (Math.random()*90-45)+'px');
      c.style.setProperty('--cr', (200+Math.random()*260)+'deg');
      c.style.background = CONFETTI_COLORS[Math.floor(Math.random()*CONFETTI_COLORS.length)];
      c.style.animationDelay = (Math.random()*0.12)+'s';
      gamewrap.appendChild(c);
      setTimeout(()=>c.remove(), 1200);
    }
  }

  function popBalloon(b){
    b.active = false;
    confettiBurst(b.x, b.y + 24);

    /* parachute takes the basket down */
    const bskEl = b.el.querySelector('.bsk');
    const wrapRect = gamewrap.getBoundingClientRect();
    const bskRect = bskEl.getBoundingClientRect();
    const cx = bskRect.left - wrapRect.left + bskRect.width/2;
    const cy = bskRect.top - wrapRect.top - 34;
    const chute = document.createElement('div');
    chute.className = 'chute';
    chute.style.left = cx+'px';
    chute.style.top = cy+'px';
    chute.style.setProperty('--cl', b.sch.bl);
    chute.style.setProperty('--cc', b.sch.bc);
    const canopy = document.createElement('div'); canopy.className='canopy';
    const clines = document.createElementNS('http://www.w3.org/2000/svg','svg');
    clines.setAttribute('class','clines'); clines.setAttribute('width','44'); clines.setAttribute('height','12');
    clines.innerHTML = '<line x1="8" y1="0" x2="15" y2="12" stroke="#A98F63" stroke-width="1.3"/><line x1="36" y1="0" x2="29" y2="12" stroke="#A98F63" stroke-width="1.3"/>';
    const cbsk = document.createElement('div'); cbsk.className='cbsk'; cbsk.textContent = bskEl.textContent;
    chute.appendChild(canopy); chute.appendChild(clines); chute.appendChild(cbsk);
    gamewrap.appendChild(chute);
    setTimeout(()=>chute.remove(), 1700);

    b.el.classList.add('popping');
    setTimeout(()=>b.el.remove(), 400);
    balloons = balloons.filter(x=>x!==b);
    playPop();
    addScore(10);
    popScoreText(b.x, b.y + 10, '+10');
    cleared++; renderProgress();
    maybeFinish();
  }

  function loseHeartFor(b){
    b.active = false;
    b.el.remove();
    balloons = balloons.filter(x=>x!==b);
    queue.push(b.wordIdx);
    hearts--; renderHearts(); playHeartLose();
    gamewrap.classList.add('shake');
    setTimeout(()=>gamewrap.classList.remove('shake'),300);
    if(hearts<=0){ endGame(false); }
  }

  function maybeFinish(){
    if(cleared >= TOTAL && queue.length===0 && balloons.length===0){
      endGame(true);
    }
  }

  function endGame(win){
    gameRunning = false;
    if(win){ playClear(); document.getElementById('ov-emoji').textContent = '🎉'; }
    else { playGameOver(); document.getElementById('ov-emoji').textContent = '💔'; }
    document.getElementById('finalscore').textContent = score;
    overlay.style.display = 'flex';
  }

  let lastTime = null;
  function loop(ts){
    if(!gameRunning) return;
    if(lastTime===null) lastTime = ts;
    const dt = Math.min((ts-lastTime)/1000, 0.1); lastTime = ts;
    const floorY = gamewrap.clientHeight;

    balloons.slice().forEach(b=>{
      if(!b.active) return;
      b.y += b.speed*dt;
      b.el.style.top = b.y+'px';
      if(b.y > floorY){ loseHeartFor(b); }
    });

    bonuses.slice().forEach(b=>{
      if(!b.active) return;
      b.y += b.speed*dt;
      b.el.style.top = b.y+'px';
      if(b.y > floorY){ b.active=false; b.el.remove(); bonuses = bonuses.filter(x=>x!==b); }
    });

    if(queue.length && ts - lastWave > waveInterval && balloons.length < 5){
      lastWave = ts; spawnWave();
    }
    if(ts - lastBonus > bonusInterval){
      lastBonus = ts; bonusInterval = 14000 + Math.random()*8000;
      spawnBonus();
    }

    requestAnimationFrame(loop);
  }

  function resetGame(){
    balloons.forEach(b=>b.el.remove()); balloons=[];
    bonuses.forEach(b=>b.el.remove()); bonuses=[];
    hearts=5; score=0; cleared=0;
    queue = shuffledIndices();
    Composer.clear();
    initHearts(); renderHearts();
    scoreValEl.textContent='0'; renderProgress();
    renderCompose();
    lastWave = 0; lastBonus = 0; lastTime = null;
    overlay.style.display='none';
  }

  function startGame(){
    resetGame();
    stopDemo();
    gameRunning = true;
    startTap.style.display = 'none';
    requestAnimationFrame(ts=>{ lastWave = ts - waveInterval + 400; lastBonus = ts - bonusInterval + 6000; loop(ts); });
  }

  document.getElementById('startbtn').addEventListener('click', ()=>{ ctx(); startGame(); });
  document.getElementById('restartbtn').addEventListener('click', startGame);

  /* clouds */
  function makeCloud(topPct, scale, duration, delay){
    const c = document.createElement('div');
    c.className = 'cloud';
    c.style.top = topPct + '%'; c.style.left = '0';
    c.style.width = (140*scale)+'px'; c.style.height = (56*scale)+'px';
    c.style.animationDuration = duration+'s'; c.style.animationDelay = delay+'s';
    c.style.opacity = 0.55 + Math.random()*0.3;
    [[0,22,52],[30,6,66],[66,14,58],[96,26,44],[22,30,48],[58,34,42]].forEach(([px,py,size])=>{
      const p = document.createElement('div'); p.className='puff';
      p.style.left = (px*scale)+'px'; p.style.top = (py*scale)+'px';
      p.style.width = (size*scale)+'px'; p.style.height = (size*scale*0.9)+'px';
      c.appendChild(p);
    });
    gamewrap.appendChild(c);
  }
  makeCloud(4, 1.0, 95, -20);
  makeCloud(16, 0.65, 120, -70);
  makeCloud(34, 0.8, 110, -45);

  function makeFoods(){
    const spots = [
      {l:'8%',  t:'5%',  dur:4.4, dl:0},
      {l:'85%', t:'7%',  dur:5.2, dl:1.1},
      {l:'14%', t:'28%', dur:4.8, dl:0.6},
      {l:'88%', t:'30%', dur:5.6, dl:1.8},
      {l:'52%', t:'4%',  dur:5.0, dl:2.4},
      {l:'8%',  t:'52%', dur:5.4, dl:0.9, rot:-12},
      {l:'87%', t:'54%', dur:4.6, dl:2.0},
      {l:'62%', t:'42%', dur:5.8, dl:1.4},
      {l:'30%', t:'58%', dur:5.1, dl:2.8, rot:10},
      {l:'70%', t:'15%', dur:4.9, dl:0.4}
    ];
    spots.forEach((sp,i)=>{
      const f = document.createElement('div');
      f.className = 'food';
      f.innerHTML = sp.rot
        ? '<div style="transform:rotate('+sp.rot+'deg)">'+FOOD_SVGS[i % FOOD_SVGS.length]+'</div>'
        : FOOD_SVGS[i % FOOD_SVGS.length];
      f.style.left = sp.l; f.style.top = sp.t;
      f.style.animationDuration = sp.dur+'s';
      f.style.animationDelay = sp.dl+'s';
      gamewrap.appendChild(f);
    });
  }
  makeFoods();

  initHearts(); renderHearts();

  const style2 = document.createElement('style');
  style2.textContent = '.shake{animation:shakeAnim .3s;} @keyframes shakeAnim{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}';
  document.head.appendChild(style2);

  /* ---------------- START-SCREEN DEMO (balloon version) ---------------- */
  const demo = document.getElementById('demo');
  let demoTimers = [], demoRunning = false;

  function dEl(tag, cls, txt){
    const e = document.createElement(tag); e.className = cls;
    if(txt !== undefined) e.textContent = txt;
    demo.appendChild(e); return e;
  }
  function dAfter(ms, fn){ demoTimers.push(setTimeout(fn, ms)); }

  function runDemo(){
    if(!demoRunning) return;
    demo.innerHTML = '';

    const heartRow = dEl('div','dheartrow','❤️❤️❤️❤️🤍');

    const unit = dEl('div','dunit');
    unit.style.left='42%'; unit.style.top='-70px';
    const bln = document.createElement('div'); bln.className='dbln'; bln.textContent='구두';
    const str = document.createElementNS('http://www.w3.org/2000/svg','svg');
    str.setAttribute('width','36'); str.setAttribute('height','11');
    str.innerHTML = '<line x1="10" y1="0" x2="13" y2="11" stroke="#A98F63" stroke-width="1.3"/><line x1="26" y1="0" x2="23" y2="11" stroke="#A98F63" stroke-width="1.3"/>';
    str.style.display='block'; str.style.marginTop='-1px';
    const bsk = document.createElement('div'); bsk.className='dbsk'; bsk.style.marginTop='0'; bsk.textContent='靴';
    unit.appendChild(bln); unit.appendChild(str); unit.appendChild(bsk);

    const compose = dEl('div','',''); compose.id='dcompose';
    const keysWrap = dEl('div',''); keysWrap.id='dkeys';
    const dkeys = {};
    ['ㄱ','ㅜ','ㄷ'].forEach(j=>{
      const k = document.createElement('div'); k.className='dkey'; k.textContent=j;
      keysWrap.appendChild(k); dkeys[j]=k;
    });

    let y=-90, v=2.0;
    const fall = setInterval(()=>{
      y += v;
      v = Math.max(0.3, v*0.985);
      unit.style.top=y+'px';
    },30);
    demoTimers.push(fall);

    [['ㄱ','ㄱ',3100],['ㅜ','구',3800],['ㄷ','구ㄷ',4500],['ㅜ','구두',5200]].forEach(([key, txt, t])=>{
      dAfter(t, ()=>{
        dkeys[key].classList.add('hit');
        compose.textContent = txt;
        setTimeout(()=>dkeys[key].classList.remove('hit'), 250);
      });
    });

    dAfter(5600, ()=>{
      clearInterval(fall);
      const uTop = unit.offsetTop;
      const pop = document.createElement('div'); pop.className='dpop'; pop.textContent='🎈💥';
      pop.style.left='46%'; pop.style.top=(uTop+22)+'px';
      demo.appendChild(pop);

      /* mini parachute carries the basket down */
      const chute = document.createElement('div');
      chute.className='chute';
      chute.style.left='42%';
      chute.style.top=(uTop+34)+'px';
      chute.style.setProperty('--cl','#FFE0E9');
      chute.style.setProperty('--cc','#FFC9D6');
      const canopy = document.createElement('div'); canopy.className='canopy';
      canopy.style.width='38px'; canopy.style.height='18px';
      const clines = document.createElementNS('http://www.w3.org/2000/svg','svg');
      clines.setAttribute('class','clines'); clines.setAttribute('width','34'); clines.setAttribute('height','10');
      clines.innerHTML = '<line x1="7" y1="0" x2="12" y2="10" stroke="#A98F63" stroke-width="1.2"/><line x1="27" y1="0" x2="22" y2="10" stroke="#A98F63" stroke-width="1.2"/>';
      const cbsk = document.createElement('div'); cbsk.className='cbsk';
      cbsk.style.fontSize='12px'; cbsk.textContent='靴';
      chute.appendChild(canopy); chute.appendChild(clines); chute.appendChild(cbsk);
      demo.appendChild(chute);
      demoTimers.push(setTimeout(()=>chute.remove(), 1700));

      unit.remove();
      compose.textContent = '';
    });

    dAfter(6500, ()=>{
      const hb = dEl('div','dheart','💗');
      hb.style.left='50%'; let hy=-30; hb.style.top=hy+'px';
      const hand = dEl('div','dhand','👆');
      const hfall = setInterval(()=>{ hy+=0.9; hb.style.top=hy+'px'; hand.style.left='50%'; hand.style.top=(hy+18)+'px'; },30);
      demoTimers.push(hfall);
      dAfter(1300, ()=>{ hand.style.opacity='1'; });
      dAfter(1800, ()=>{
        clearInterval(hfall);
        const pop = document.createElement('div'); pop.className='dpop'; pop.textContent='💗';
        pop.style.left='50%'; pop.style.top=hb.style.top;
        demo.appendChild(pop);
        hb.remove(); hand.remove();
        heartRow.textContent = '❤️❤️❤️❤️❤️';
      });
    });

    dAfter(9800, runDemo);
  }
  function startDemo(){ demoRunning = true; runDemo(); }
  function stopDemo(){
    demoRunning = false;
    demoTimers.forEach(t=>{ clearTimeout(t); clearInterval(t); });
    demoTimers = [];
  }
  startDemo();

})();
</script>
