<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ㅍ 자음 매칭 게임</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #081520; color: #F0EEF8; height: 100vh; overflow: hidden; }
  #app { height: 100vh; display: flex; flex-direction: column; }
  button { font-family: inherit; border: none; cursor: pointer; }
  .screen-center { min-height: 100vh; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; gap: 40px; }
  .title-stack { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .title-cons { font-size: 56px; font-weight: 900; color: #FFFFFF; line-height: 1; }
  .title-ko { font-size: 22px; font-weight: 900; color: #FFFFFF; letter-spacing: 0.02em; }
  .title-en { font-size: 13px; font-weight: 700; letter-spacing: 0.12em; color: #00CED1; }
  .dots { display: flex; gap: 6px; margin-top: 4px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #00CED1; }
  .menu-list { display: flex; flex-direction: column; gap: 16px; width: 100%; max-width: 320px; }
  .diff-btn { display: flex; align-items: center; justify-content: space-between; border-radius: 16px; padding: 20px 24px; background: #103040; box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: transform 0.15s; }
  .diff-btn:active { transform: scale(0.95); }
  .label-wrap { display: flex; align-items: center; gap: 6px; }
  .label-syl { font-size: 22px; font-weight: 900; color: #00CED1; }
  .label-dot { font-size: 18px; color: #F0EEF8; opacity: 0.5; }
  .count { font-size: 24px; font-weight: 600; color: #F0EEF8; }
  .header { display: flex; align-items: center; justify-content: space-between; width: 100%; max-width: 480px; margin: 0 auto; padding: 14px 16px 6px; flex-shrink: 0; }
  .icon-btn { width: 40px; height: 40px; border-radius: 50%; background: #103040; display: flex; align-items: center; justify-content: center; font-size: 16px; color: #F0EEF8; }
  .stats { display: flex; gap: 16px; font-size: 14px; font-weight: 500; color: #F0EEF8; }
  .stats .time { color: #00CED1; }
  .board-wrap { flex: 1; overflow-y: auto; padding: 4px 16px 0; }
  .board { display: grid; gap: 8px; width: 100%; max-width: 480px; margin: 0 auto; padding-bottom: 8px; }
  .card { aspect-ratio: 1/1; border-radius: 16px; display: flex; align-items: center; justify-content: center; position: relative; transition: transform 0.15s, background 0.2s, opacity 0.2s; box-shadow: 0 3px 8px rgba(0,0,0,0.3); }
  .card:active { transform: scale(0.95); }
  .card .sym { font-size: 26px; font-weight: bold; }
  .card .dot-hidden { width: 10px; height: 10px; border-radius: 50%; background: #00CED1; opacity: 0.4; }
  .vol-icon { position: absolute; bottom: 6px; right: 6px; font-size: 10px; opacity: 0.6; }
  .collection-box { width: 100%; max-width: 480px; margin: 8px auto 0; border-radius: 20px; padding: 10px 16px 14px; display: flex; flex-direction: column; gap: 8px; background: #103040; box-shadow: 0 4px 16px rgba(0,0,0,0.3); border: 2px solid rgba(255,255,255,0.1); }
  .collection-title { display: flex; align-items: center; gap: 8px; padding: 0 4px; }
  .collection-title .line { flex: 1; height: 1px; background: #F0EEF8; opacity: 0.2; }
  .collection-title span { font-size: 12px; font-weight: bold; letter-spacing: 0.05em; color: #F0EEF8; opacity: 0.9; }
  .chips-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .empty-hint { display: flex; align-items: center; gap: 8px; opacity: 0.6; font-size: 11px; color: #C8C4E0; padding: 2px 0; }
  .chip-wrap { position: relative; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; overflow: visible; }
  .chip { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 16px; color: #081520; border: 3px solid white; position: relative; z-index: 10; animation: popInCute 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; box-shadow: 0 4px 0 rgba(0,0,0,0.2), 0 6px 10px rgba(0,0,0,0.3); }
  .spark { position: absolute; top: 50%; left: 50%; width: 9px; height: 9px; border-radius: 9999px; animation: sparkBurst 0.9s ease-out forwards; pointer-events: none; z-index: 20; box-shadow: 0 0 6px 2px rgba(255,255,255,0.7); }
  @keyframes popInCute { 0% { transform: scale(0) rotate(-180deg); opacity: 0; } 60% { transform: scale(1.3) rotate(10deg); opacity: 1; } 80% { transform: scale(0.9) rotate(-5deg); } 100% { transform: scale(1) rotate(0deg); opacity: 1; } }
  @keyframes sparkBurst { 0% { transform: translate(-50%,-50%) translate(0,0) scale(1); opacity: 1; } 100% { transform: translate(-50%,-50%) translate(var(--tx),var(--ty)) scale(0); opacity: 0; } }
  .complete-screen { gap: 32px; }
  .complete-label { font-size: 32px; font-weight: 900; color: #00CED1; display: flex; gap: 12px; align-items: center; }
  .complete-stats { display: flex; gap: 32px; text-align: center; color: #F0EEF8; }
  .complete-stats .num { font-size: 32px; font-weight: bold; }
  .complete-stats .lbl { font-size: 11px; opacity: 0.6; margin-top: 4px; }
  .complete-actions { display: flex; gap: 16px; }
  .round-btn { width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; box-shadow: 0 6px 16px rgba(0,0,0,0.3); }
</style>

function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function buildDeck(set){const pairs=set.flatMap((item,i)=>[{uid:`${i}-a`,key:i,...item},{uid:`${i}-b`,key:i,...item}]);return shuffle(pairs).map(c=>{return{...c,flipped:false,matched:false}});}
function formatTime(s){const m=Math.floor(s/60);const sec=s%60;return `${m}:${sec.toString().padStart(2,"0")}`;}
let cachedKoVoice=null;
function pickKoreanVoice(){if(cachedKoVoice)return cachedKoVoice;if(!("speechSynthesis"in window))return null;const voices=window.speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.startsWith("ko"));if(!voices.length)return null;cachedKoVoice=[...voices].sort((a,b)=>Number(a.localService)-Number(b.localService))[0];return cachedKoVoice;}
function speak(text){try{if(!("speechSynthesis"in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);const voice=pickKoreanVoice();if(voice)u.voice=voice;u.lang="ko-KR";u.rate=0.9;u.pitch=1.0;window.speechSynthesis.speak(u);}catch(e){}}
function playAudio(audioChar){try{const dataUrl=AUDIO_MAP[audioChar];if(dataUrl){const audio=new Audio(dataUrl);audio.onerror=()=>speak(audioChar);audio.play().catch(()=>speak(audioChar));}else{speak(audioChar);}}catch(e){speak(audioChar);}}
let state={screen:"menu",difficulty:null,deck:[],activeFlips:[],moves:0,seconds:0,locked:false,collected:[],timerId:null};
function setState(patch){Object.assign(state,patch);render();}
function startGame(diff){if(state.timerId)clearInterval(state.timerId);const deck=buildDeck(DIFFICULTIES[diff].set);state={screen:"playing",difficulty:diff,deck,activeFlips:[],moves:0,seconds:0,locked:false,collected:[],timerId:null};state.timerId=setInterval(()=>{state.seconds+=1;const el=document.getElementById("time-display");if(el)el.textContent=formatTime(state.seconds);},1000);render();}
function updateCardDOM(uid){const card=state.deck.find(c=>c.uid===uid);const btn=document.querySelector(`.card[data-uid="${uid}"]`);if(!btn||!card)return;const shown=card.flipped||card.matched;btn.style.background=card.matched?"#107A80":shown?"#F0EEF8":"#103040";btn.style.opacity=card.matched?"0.5":"1";if(card.matched)btn.setAttribute("disabled","true");btn.innerHTML=shown?`<span class="sym" style="color:#081520">${card.sym}</span>`:`<span class="dot-hidden"></span>`;if(card.matched)btn.insertAdjacentHTML("beforeend",`<span class="vol-icon">🔊</span>`);}
function updateMovesDOM(){const el=document.getElementById("moves-display");if(el)el.textContent=`${state.moves} moves`;}
function appendNewChip(index){const container=document.getElementById("chips-row");if(!container)return;const hint=container.querySelector(".empty-hint");if(hint)hint.remove();const sym=state.collected[index];const sparks=SPARK_OFFSETS.map(([tx,ty],j)=>`<span class="spark" style="background:${SPARK_COLORS[j%SPARK_COLORS.length]};--tx:${tx}px;--ty:${ty}px"></span>`).join("");container.insertAdjacentHTML("beforeend",`<div class="chip-wrap">${sparks}<div class="chip" style="background:${CHIP_COLORS[index%CHIP_COLORS.length]}">${sym}</div></div>`);}
function handleFlip(uid){if(state.locked)return;const card=state.deck.find(c=>c.uid===uid);if(!card||card.flipped||card.matched)return;playAudio(card.audio);card.flipped=true;state.activeFlips.push(uid);updateCardDOM(uid);if(state.activeFlips.length===2){state.locked=true;state.moves+=1;updateMovesDOM();const[a,b]=state.activeFlips;const cardA=state.deck.find(c=>c.uid===a);const cardB=state.deck.find(c=>c.uid===b);const isMatch=cardA.key===cardB.key;setTimeout(()=>{if(isMatch){cardA.matched=true;cardB.matched=true;state.collected.push(cardA.sym);updateCardDOM(a);updateCardDOM(b);appendNewChip(state.collected.length-1);}else{cardA.flipped=false;cardB.flipped=false;updateCardDOM(a);updateCardDOM(b);}state.activeFlips=[];state.locked=false;const total=DIFFICULTIES[state.difficulty].set.length;const matched=state.deck.filter(c=>c.matched).length/2;if(matched===total){clearInterval(state.timerId);setTimeout(()=>setState({screen:"complete"}),500);}},isMatch?450:800);}}
function render(){const app=document.getElementById("app");if(state.screen==="menu"){app.innerHTML=renderMenu();attachMenuEvents();}else if(state.screen==="playing"){app.innerHTML=renderPlaying();attachPlayingEvents();}else if(state.screen==="complete"){app.innerHTML=renderComplete();attachCompleteEvents();}}
function renderMenu(){const items=Object.entries(DIFFICULTIES).map(([key,val])=>{const syllables=`<span class="label-syl">${val.label[0]}</span><span class="label-dot">·</span><span class="label-syl">${val.label[1]}</span>`;return`<button class="diff-btn" data-diff="${key}"><span class="label-wrap">${syllables}</span><span class="count">${val.set.length}</span></button>`;} ).join("");return`<div class="screen-center"><div class="title-stack"><span class="title-cons">${TARGET_CONS}</span><span class="title-ko">자음 매칭</span><span class="title-en">CONSONANT MATCHING</span><div class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div></div><div class="menu-list">${items}</div></div>`;}
function attachMenuEvents(){document.querySelectorAll(".diff-btn").forEach(btn=>btn.addEventListener("click",()=>startGame(btn.dataset.diff)));}
function renderPlaying(){const cols=DIFFICULTIES[state.difficulty].cols;const cards=state.deck.map(card=>{const shown=card.flipped||card.matched;const bg=card.matched?"#107A80":shown?"#F0EEF8":"#103040";const inner=shown?`<span class="sym" style="color:#081520">${card.sym}</span>`:`<span class="dot-hidden"></span>`;const vol=card.matched?`<span class="vol-icon">🔊</span>`:"";return`<button class="card" data-uid="${card.uid}" style="background:${bg};opacity:${card.matched?0.5:1}" ${card.matched?"disabled":""}>${inner}${vol}</button>`;}).join("");const chips=state.collected.map((sym,i)=>{const sparks=SPARK_OFFSETS.map(([tx,ty],j)=>`<span class="spark" style="background:${SPARK_COLORS[j%SPARK_COLORS.length]};--tx:${tx}px;--ty:${ty}px"></span>`).join("");return`<div class="chip-wrap">${sparks}<div class="chip" style="background:${CHIP_COLORS[i%CHIP_COLORS.length]}">${sym}</div></div>`;}).join("");const emptyHint=state.collected.length===0?`<div class="empty-hint">✨ Match a pair to collect a syllable chip!</div>`:"";return`<div class="header"><button class="icon-btn" id="back-btn">←</button><div class="stats"><span id="moves-display">${state.moves} moves</span><span class="time" id="time-display">${formatTime(state.seconds)}</span></div></div><div class="board-wrap"><div class="board" style="grid-template-columns:repeat(${cols},1fr)">${cards}</div><div class="collection-box"><div class="collection-title"><span>🌊 My Syllable Box</span><div class="line"></div></div><div class="chips-row" id="chips-row">${emptyHint}${chips}</div></div></div>`;}
function attachPlayingEvents(){document.getElementById("back-btn").addEventListener("click",()=>{if(state.timerId)clearInterval(state.timerId);setState({screen:"menu"});});document.querySelectorAll(".card").forEach(btn=>btn.addEventListener("click",()=>handleFlip(btn.dataset.uid)));}
function renderComplete(){const diffLabel=DIFFICULTIES[state.difficulty].label;const total=DIFFICULTIES[state.difficulty].set.length;let earned=1;if(state.moves<=total*1.3)earned=3;else if(state.moves<=total*1.8)earned=2;const starsStr=Array.from({length:3},(_,i)=>i<earned?"⭐":"☆").join("");return`<div class="screen-center complete-screen"><div style="font-size:48px">✨</div><div class="complete-label">${diffLabel[0]} · ${diffLabel[1]}</div><div style="font-size:24px">${starsStr}</div><div class="complete-stats"><div><div class="num">${state.moves}</div><div class="lbl">moves</div></div><div><div class="num">${formatTime(state.seconds)}</div><div class="lbl">time</div></div></div><div class="complete-actions"><button class="round-btn" id="menu-btn" style="background:#103040">←</button><button class="round-btn" id="retry-btn" style="background:#107A80">↻</button></div></div>`;}
function attachCompleteEvents(){document.getElementById("menu-btn").addEventListener("click",()=>setState({screen:"menu"}));document.getElementById("retry-btn").addEventListener("click",()=>startGame(state.difficulty));}
if("speechSynthesis"in window){window.speechSynthesis.getVoices();window.speechSynthesis.addEventListener("voiceschanged",()=>{cachedKoVoice=null;});}
let audioUnlocked=false;
function unlockAudio(){if(audioUnlocked)return;audioUnlocked=true;try{const silence=new Audio("data:audio/mpeg;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjU4LjIwLjEwMAAAAAAAAAAAAAAA//OEAAAAAAAAAAAAAAAAAAAAAAAASW5mbwAAAA8AAAAEAAABIADAwMDAwMDAwMDAwMDAwMDAwMDAwMDV1dXV1dXV1dXV1dXV1dXV1dXV1dXV6urq6urq6urq6urq6urq6urq6urq6v////////////////////////////////8AAAAATGF2YzU4LjM1AAAAAAAAAAAAAAAAJAAAAAAAAAAAASDs90hvAAAAAAAAAAAAAAAAAAAA");silence.play().catch(()=>{});}catch(e){}}
document.addEventListener("touchstart",unlockAudio,{once:true});
document.addEventListener("click",unlockAudio,{once:true});
render();
