<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1コマ漫画クイズ | 韓国語遊びラボ、「コアラ」</title>
<link href="https://fonts.googleapis.com/css2?family=Single+Day&family=Noto+Sans+JP:wght@400;500;700&family=Gaegu:wght@400;700&family=Do+Hyeon&family=Nanum+Gothic:wght@400;700&family=Yomogi&family=Poor+Story&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">

  <div class="detail-header">
    <a class="back" href="manga.html">‹</a>
    <div class="detail-title">
      <div class="jp">1コマ漫画クイズ</div>
      <div class="kr">한 컷 만화 퀴즈</div>
    </div>
  </div>

  <div class="breadcrumb"><a href="manga.html">1コマ漫画クイズ</a> <span class="sep">›</span> <span id="bcTitle">...</span></div>

  <div class="content" id="mainContent">
    <div class="board-empty" style="padding:60px 20px;">読み込み中...</div>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const params = new URLSearchParams(window.location.search);
const id = params.get('id');
const mainContent = document.getElementById('mainContent');

if (!id) {
  mainContent.innerHTML = '<div class="board-empty" style="padding:60px 20px;">エピソードが見つかりません。</div>';
} else {
  db.collection('manga').doc(id).get().then(doc => {
    if (!doc.exists) {
      mainContent.innerHTML = '<div class="board-empty" style="padding:60px 20px;">エピソードが見つかりません。</div>';
      return;
    }
    const d = doc.data();
    document.getElementById('bcTitle').textContent = '#' + (d.ep || '') + ' ' + d.title;
    document.title = '#' + (d.ep || '') + ' ' + d.title + ' | 韓国語遊びラボ、「コアラ」';

    const opts = d.opts || [];
    const letters = ['A','B','C','D'];
    let optsHtml = '';
    opts.forEach((opt, i) => {
      if (!opt) return;
      optsHtml += `<div class="quiz-opt" data-correct="${i === d.correctIdx}" onclick="answerQuiz(this)"><span class="letter">${letters[i]}</span>${escapeHtml(opt)}</div>`;
    });

    mainContent.innerHTML = `
      <div class="toon-title">
        <div class="ep">#${escapeHtml(d.ep || '')}</div>
        <div class="jp">${escapeHtml(d.title)}</div>
      </div>

      <div class="toon-frame">
        ${d.bubble ? `<div class="speech-bubble" id="speechBubble" data-jp="${escapeHtml(d.bubble)}" data-kr="${escapeHtml(d.bubbleKr || '')}">${escapeHtml(d.bubble)}</div>` : ''}
        <img src="${d.img || 'koara_logo.png'}" alt="" onerror="this.src='koara_logo.png'">
      </div>

      ${(d.quizQ || opts.some(o => o)) ? `
      <div class="quiz-block">
        <div class="quiz-q">Q. ${escapeHtml(d.quizQ || '韓国語で何て言う？')}</div>
        <div class="quiz-options" id="quizOptions">${optsHtml}</div>
        <div class="quiz-feedback" id="quizFeedback"></div>
      </div>` : ''}

      ${(d.chat || d.chatKr) ? `
      <div class="chat-block">
        <img src="assets/hyunju-avatar.png" alt="현주쌤">
        <div style="flex:1; min-width:0;">
          <div class="label2">현주쌤 한마디 <span class="label2-jp">（ヒョンジュ先生の一言）</span></div>
          <div class="chat-cols">
            <div class="chat-col">
              <div class="kr">${escapeHtml(d.chatKr || '')}</div>
            </div>
            <div class="chat-col">
              <div class="jp">${escapeHtml(d.chat || '')}</div>
            </div>
          </div>
        </div>
      </div>` : ''}
    `;
  }).catch(err => {
    mainContent.innerHTML = '<div class="board-empty" style="padding:60px 20px;">読み込みに失敗しました。</div>';
    console.error(err);
  });
}

function answerQuiz(el) {
  // 이미 정답을 맞혀서 완료된 상태면 더 이상 반응하지 않음
  if (document.getElementById('quizOptions').classList.contains('quiz-solved')) return;

  const opts = document.querySelectorAll('#quizOptions .quiz-opt');
  const isCorrect = el.getAttribute('data-correct') === 'true';

  if (isCorrect) {
    // 정답: 전체 잠금 + 정답 초록 표시
    document.getElementById('quizOptions').classList.add('quiz-solved');
    opts.forEach(o => {
      o.classList.add('disabled');
      if (o.getAttribute('data-correct') === 'true') o.classList.add('correct');
    });
    document.getElementById('quizFeedback').textContent = '正解です！🎉';

    // 말풍선 대사를 한국어로 전환
    const bubble = document.getElementById('speechBubble');
    if (bubble && bubble.dataset.kr) {
      bubble.classList.add('flip');
      setTimeout(() => {
        bubble.textContent = bubble.dataset.kr;
        bubble.classList.add('kr-mode');
      }, 200);
    }
  } else {
    // 오답: 흔들림 표시 후 다시 시도 가능 (다른 옵션은 그대로 클릭 가능)
    el.classList.remove('shake');
    void el.offsetWidth; // 애니메이션 재시작을 위한 리플로우
    el.classList.add('wrong', 'shake');
    document.getElementById('quizFeedback').textContent = '間違いです！もう一度挑戦してみてね。';
  }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>
</body>
</html>
