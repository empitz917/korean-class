<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>フラッシュカード | 韓国語遊びラボ、「コアラ」</title>
<link href="https://fonts.googleapis.com/css2?family=Single+Day&family=Noto+Sans+JP:wght@400;500;700&family=Gaegu:wght@400;700&family=Do+Hyeon&family=Yomogi&family=Poor+Story&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">

  <div class="detail-header">
    <a class="back" href="flashcards.html">‹</a>
    <div class="detail-title">
      <div class="jp">フラッシュカード</div>
      <div class="kr">플래시카드</div>
    </div>
  </div>

  <div class="breadcrumb"><a href="flashcards.html">フラッシュカード</a> <span class="sep">›</span> <span id="bcTitle">...</span></div>

  <div class="content" id="mainContent">
    <div class="board-empty" style="padding:60px 20px;">読み込み中...</div>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const params = new URLSearchParams(window.location.search);
const id = params.get('id');
const mainContent = document.getElementById('mainContent');

let cards = [];
let idx = 0;
let flipped = false;

if (!id) {
  mainContent.innerHTML = '<div class="board-empty" style="padding:60px 20px;">セットが見つかりません。</div>';
} else {
  db.collection('flashcardSets').doc(id).get().then(doc => {
    if (!doc.exists) {
      mainContent.innerHTML = '<div class="board-empty" style="padding:60px 20px;">セットが見つかりません。</div>';
      return;
    }
    const d = doc.data();
    cards = d.cards || [];
    document.getElementById('bcTitle').textContent = d.title;
    document.title = d.title + ' | 韓国語遊びラボ、「コアラ」';

    if (!cards.length) {
      mainContent.innerHTML = '<div class="board-empty" style="padding:60px 20px;">カードがありません。</div>';
      return;
    }

    mainContent.innerHTML = `
      <div class="toon-title" style="text-align:center;">
        <div class="jp">${escapeHtml(d.title)}</div>
      </div>
      <div class="fc-viewer">
        <div class="fc-progress" id="fcProgress"></div>
        <div class="flashcard" id="flashcard">
          <div class="flashcard-inner" id="flashcardInner">
            <div class="flashcard-face flashcard-front">
              <div class="flashcard-word" id="fcFront"></div>
              <div class="flashcard-hint">탭해서 뜻 보기</div>
            </div>
            <div class="flashcard-face flashcard-back">
              <div class="flashcard-meaning" id="fcBack"></div>
              <div class="flashcard-example" id="fcExample"></div>
            </div>
          </div>
        </div>
        <div class="fc-nav">
          <button id="prevBtn">‹</button>
          <button class="fc-flip-btn" id="flipBtn">뒤집기</button>
          <button id="nextBtn">›</button>
        </div>
      </div>
    `;

    document.getElementById('flashcard').addEventListener('click', toggleFlip);
    document.getElementById('flipBtn').addEventListener('click', (e) => { e.stopPropagation(); toggleFlip(); });
    document.getElementById('prevBtn').addEventListener('click', () => go(-1));
    document.getElementById('nextBtn').addEventListener('click', () => go(1));

    render();
  }).catch(err => {
    mainContent.innerHTML = '<div class="board-empty" style="padding:60px 20px;">読み込みに失敗しました。</div>';
    console.error(err);
  });
}

function render() {
  const c = cards[idx];
  document.getElementById('fcFront').textContent = c.front;
  document.getElementById('fcBack').textContent = c.back;
  const exampleLines = (c.example || '').split('/').map(s => s.trim()).filter(Boolean);
  document.getElementById('fcExample').innerHTML = exampleLines
    .map((line, i) => `<div class="ex-line ${i === 0 ? 'ex-kr' : 'ex-jp'}">${escapeHtml(line)}</div>`)
    .join('');
  document.getElementById('fcProgress').textContent = (idx + 1) + ' / ' + cards.length;
  document.getElementById('prevBtn').disabled = (idx === 0);
  document.getElementById('nextBtn').disabled = (idx === cards.length - 1);
  flipped = false;
  document.getElementById('flashcard').classList.remove('flipped');
}

function toggleFlip() {
  flipped = !flipped;
  document.getElementById('flashcard').classList.toggle('flipped', flipped);
}

function go(dir) {
  const next = idx + dir;
  if (next < 0 || next >= cards.length) return;
  idx = next;
  render();
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>
</body>
</html>
